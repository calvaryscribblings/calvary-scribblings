<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Reading Room</title>
<!--
  The Reading Room — Calvary-owned reader host (R4a). This file is OURS; it lives at the public
  root (NOT inside public/vendor/foliate-js-main/, which stays pristine). It imports the vendored
  foliate-js modules read-only via absolute /vendor/… paths and does the iframe-side R4a work:
  CFI relocate/goTo, setStyles (paper/face/size/leading/justification), flow toggle, built-in
  search, a ready-gated goTo queue, and an origin-locked postMessage bridge to the React chrome
  in app/reader/[slug]/page-reader.js.

  It superseded public/vendor/foliate-js-main/calvary-reader.html, which R11.18 DELETED. That file
  had been dead since R4a and was left in place on the reasoning that the vendored tree is not ours
  to edit — sound as far as it went, but it was a CALVARY file living inside the vendored engine
  directory, which is what made it dead weight in the first place. It also sat inside the tree that
  FOLIATE.lock now pins, so a Calvary file was contributing to a number whose whole purpose is to
  compare two copies of somebody else's engine. One removal fixed both, once, deliberately.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Cinzel:wght@400;600&family=Inter:wght@300;400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
  /* R4a.2 (fault A): the host document must be paper-coloured at every layer. `height:100%`
     (not 100dvh) makes foliate-view fill the iframe box exactly — the parent already sizes the
     iframe, and a dvh/lvh mismatch inside a nested browsing context left a strip of untinted
     document showing below the page on iOS. */
  html,body{height:100%;margin:0;overflow:hidden}
  foliate-view{display:block;width:100%;height:100%}
  #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:100;transition:opacity .4s ease}
  #loading.hidden{opacity:0;pointer-events:none}
  #spinner{width:32px;height:32px;border:2px solid rgba(201,164,76,.2);border-top-color:#c9a44c;border-radius:50%;animation:spin .9s linear infinite}
  #loading-text{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1rem;opacity:.55}
  /* R7.3 (§8.19): the host's own last word. The register above us renders the real failure
     state — it is the only layer that knows where this reader should be sent — but if a
     register supplies none, this must still read as the Reading Room rather than as a
     browser error. Paper-coloured, set in the room's face, no red. */
  #error{display:none;position:fixed;inset:0;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;z-index:100}
  #error.show{display:flex}
  #error-orn{font-size:.8rem;letter-spacing:.4em;opacity:.35;margin-bottom:14px}
  #error-text{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.05rem;opacity:.7;line-height:1.6;max-width:22em}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* ── THE DEFINE CHIP (R7.4) ────────────────────────────────────────────────
     Gold on ink, Cinzel small-caps: the Reading Room's own voice for a control that
     appears inside the page rather than on the chrome. It lives in the HOST document,
     never in the section document — see the ownership note beside showChip() for why
     that placement is what keeps it out of the tap bands.
     44px of touch target with only ~26px of visible chip: the visible size is
     typographic restraint, the hit area is not negotiable on a phone. */
  #define-chip{position:fixed;z-index:90;display:none;align-items:center;gap:6px;
    height:44px;padding:0 14px;margin:0;border:0;border-radius:22px;cursor:pointer;
    background:linear-gradient(180deg,#2a2018 0%,#1b1410 100%);
    box-shadow:0 4px 14px rgba(0,0,0,.34),0 0 0 1px rgba(201,164,76,.42) inset;
    font-family:'Cinzel',Georgia,serif;font-size:.62rem;font-weight:600;
    letter-spacing:.2em;text-transform:uppercase;color:#e6c977;
    -webkit-tap-highlight-color:transparent;white-space:nowrap;
    animation:chipIn .16s ease-out}
  #define-chip.show{display:inline-flex}
  #define-chip .chip-orn{font-size:.7rem;line-height:1;opacity:.8}
  @keyframes chipIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){#define-chip{animation:none}}
</style>
<div id="loading"><div id="spinner"></div><div id="loading-text">Opening book…</div></div>
<div id="error"><div id="error-orn">&#10022;</div><div id="error-text">This book would not open.</div></div>
<button id="define-chip" type="button" aria-label="Define the selected word"><span class="chip-orn">&#10022;</span>Define</button>

<script type="module">
import '/vendor/foliate-js-main/view.js'
import { Overlayer } from '/vendor/foliate-js-main/overlayer.js'

// ── Origin-locked bridge (HYGIENE: replaces the old wildcard '*') ──────────────
const PARENT_ORIGIN = (() => {
  try { return document.referrer ? new URL(document.referrer).origin : location.origin } catch { return location.origin }
})()
const post = (msg) => { try { parent.postMessage(msg, PARENT_ORIGIN) } catch (e) { /* noop */ } }

const params = new URLSearchParams(location.search)
const url = params.get('url')

// Initial typesetter state from the query (prevents a flash before the parent's first message).
const initial = {
  bg: params.get('bg') || '#f2ecd9',
  fg: params.get('fg') || '#2b2418',
  face: params.get('face') || 'cormorant',
  sizePct: parseInt(params.get('size') || '100', 10),
  leading: parseFloat(params.get('leading') || '1.6'),
  flow: params.get('flow') === 'scrolled' ? 'scrolled' : 'paginated',
  justify: params.get('justify') !== '0',
}
// Paint BOTH html and body: the paginator's own grid margins sit above the document canvas, so
// any surface we leave untinted shows through as white on iOS (R4a.2 fault A).
function paintHost(bg) {
  document.documentElement.style.background = bg
  if (document.body) document.body.style.background = bg
}
paintHost(initial.bg)

const FACE_STACK = {
  cormorant: "'Cormorant Garamond', Georgia, serif",
  literata: "'Literata', Georgia, serif",
  inter: "'Inter', system-ui, sans-serif",
}

// R4a.2 fault D: justified text goes gappy at phone measures. Below 640px we fall back to
// start-aligned (ragged-right), matching the approved mockup rule. innerWidth here is the reading
// surface's own width, so this reads correctly at any column count — a media query inside the
// injected styles would key off the COLUMN width instead and mis-fire on multi-column desktop.
const JUSTIFY_MIN_WIDTH = 640
const effectiveJustify = (st) => st.justify && window.innerWidth >= JUSTIFY_MIN_WIDTH

function buildCSS(st) {
  const face = FACE_STACK[st.face] || FACE_STACK.cormorant
  const px = Math.round(18 * (st.sizePct / 100))
  return `
    /* html AND body: foliate samples the section document's background (body, falling back to
       documentElement) once per section load and paints its grid margins with it. Tinting both
       guarantees the margin gutters are paper, never the EPUB's own white. */
    html{ background:${st.bg} !important; }
    body{ font-family:${face} !important; color:${st.fg} !important; background:${st.bg} !important; font-size:${px}px !important; }
    p, li, blockquote, dd { font-family:${face} !important; font-size:${px}px !important; line-height:${st.leading} !important;
      hyphens:auto !important; -webkit-hyphens:auto !important; }
    /* R4a.3 fault 2: ALIGNMENT IS A DEFAULT, NOT A DECREE. This used to carry !important, which
       outranked the publisher's own stylesheet and flattened centred title pages, epigraphs and
       imprints to the left. :where() has zero specificity, so any author rule — even a bare
       element selector like p{text-align:center} — wins, while books that say nothing still get
       our reading default. Typeface/size/leading stay !important: those are the reader's choice.
       Indent sits in the same layer, otherwise it shifts centred lines off-centre.

       R11.18: …AND THAT FIX WAS ONLY HALF OF IT. It made our rule lose the SPECIFICITY contest,
       which is the only contest it was ever in. But zero specificity helps only when the publisher
       styles the SAME ELEMENT we style. The commonest front-matter shape in the wild is a centred
       ANCESTOR — <section epub:type="colophon">, a <header>, a titlepage div — whose <p> children
       carry no alignment of their own and merely INHERIT the centring. An inherited value does not
       compete in the cascade at all: a directly-applied declaration beats it regardless of
       specificity, so a rule on 'p' won against a publisher who had genuinely chosen an alignment,
       and flattened exactly the pages the R4a.3 note claims were fixed.

       This is live on our own catalogue, not a hypothesis: Standard Ebooks centres the colophon on
       'section.…colophon' and leaves the <p>s bare (se.css), and all three £1.99 titles are SE
       books. Their colophons have been rendering left-aligned.

       THE FIX: declare the default ONCE, on the root, and let it inherit. Then a publisher's
       declaration on any element — leaf or ancestor — is the only directly-applied one in play and
       simply wins, which is what "alignment is a default" was always supposed to mean.

       REJECTED, and why, so they are not re-proposed:
         · a heading reset (h1,h2,h3{text-align:start}) — RE-CREATES THE IDENTICAL BUG one level up:
           the same defect relocated to headings inside centred front matter.
         · text-align:inherit on the leaves — REDUNDANT: 'inherit' and no-declaration compute the
           same value whenever the cascade is silent, which is the only case that reaches them.

       THE COST, stated because it is real and small: h1/h2/h3 now inherit 'justify' at ≥640px. A
       justified block never stretches its LAST line, so a single-line heading still renders
       start-aligned; only a heading that wraps to two or more lines differs. Below 640px the value
       is 'start' and nothing changes at all.

       A SECOND THING THIS REPAIRS: respectAuthorAlignment() below reads the COMPUTED text-align.
       While our rule applied directly to <p>, an ancestor-centred paragraph computed 'start' — so
       the function could not see it was centred and left our indent on it. It now computes
       'center', and the indent is correctly neutralised. The blind spot and the flattening were
       the same bug seen from two directions. */
    :where(body) { text-align:${effectiveJustify(st) ? 'justify' : 'start'}; }
    :where(p + p) { text-indent:1.4em; }
    h1, h2, h3 { font-family:${face} !important; color:${st.fg} !important; }
    blockquote { border-inline-start:2px solid #c9a44c; padding-inline-start:1em; font-style:italic; }
    a { color:#a8842f !important; }
    pre { white-space:pre-wrap !important; }
    /* Kill decorative drop-cap images some EPUBs ship — harmless where absent. */
    span[style*="background-image"] { display:none !important; float:none !important; width:0 !important; height:0 !important; }
  `
}

// R4a.3 fault 2, second half. Our first-line indent is a reading DEFAULT, but text-indent shifts a
// centred line off-centre — so a centred title page still read as misaligned even once the
// text-align decree was lifted. CSS cannot condition a rule on the cascaded alignment of an
// element, so neutralise the indent wherever the publisher has actually chosen an alignment. Only
// paragraphs carrying OUR indent are touched; a publisher who sets their own keeps it.
function respectAuthorAlignment(doc) {
  try {
    const win = doc.defaultView
    for (const el of doc.body.querySelectorAll('p')) {
      const { textAlign, textIndent } = win.getComputedStyle(el)
      if ((textAlign === 'center' || textAlign === 'right' || textAlign === 'end') && parseFloat(textIndent) > 0) {
        el.style.setProperty('text-indent', '0', 'important')
      }
    }
  } catch (e) { /* non-fatal: alignment is cosmetic */ }
}

const state = { ...initial }
let view = null
let ready = false
let pendingGoTo = null
let pendingFraction = null
let lastCFI = ''
let lastChapter = ''
// R7.3 (§8.7): the current chapter's href, so the Contents panel can mark where the reader
// actually is. Sticky in the same way the label is — a section with no TOC entry of its own
// keeps showing the chapter it belongs to rather than blanking.
let lastChapterHref = null
let lastFraction = 0
const sectionWords = new Map()
let currentIndex = -1
let endedFired = false
let searchToken = 0
// The visible range of the current page, captured on every relocate. foliate's paginator
// computes it as part of #afterScroll and hands it to us in the relocate detail, so the
// page's own text is available without walking the column geometry ourselves.
let lastRange = null

// R7.2: the first ~80 visible characters of the current page, for the ribbon's excerpt.
// Graceful '' on any failure — a ribbon with no excerpt is still a working ribbon.
function pageExcerpt() {
  try {
    const raw = lastRange ? String(lastRange) : ''
    const clean = raw.replace(/\s+/g, ' ').trim()
    if (!clean) return ''
    if (clean.length <= 80) return clean
    const cut = clean.slice(0, 80)
    const sp = cut.lastIndexOf(' ')
    return (sp > 48 ? cut.slice(0, sp) : cut).trimEnd() + '…'
  } catch (e) { return '' }
}

function countWords(doc) {
  try { return (doc.body.innerText || '').trim().split(/\s+/).filter(Boolean).length } catch { return 0 }
}

// ── PAGE GEOMETRY (R7.3 §D) ───────────────────────────────────────────────────
//
// WHAT WENT. `minStep` — the smallest forward fraction step ever observed — used to stand
// in for the width of a page, feeding both the parent's ribbon epsilon and the footer's
// Page X of Y. It is not a ruler, and the reason is structural rather than a rounding
// wobble. Read progress.js:73-83 with paginator.js:952-969: the whole-book fraction of a
// page is
//
//       fraction = (sizeBefore + (fractionInSection + pageFraction) × sizeInSection) / sizeTotal
//
// with pageFraction = 1/(pages−2). So EVERY step foliate reports — inside a section and
// across a section boundary alike — is exactly one page OF THE DESTINATION SECTION. The
// minimum over all of them is therefore the page width of the SHORTEST SECTION in the
// book: one half-title, one one-page interlude, one short chapter, and minStep is pinned
// there for the rest of the session while the reader is somewhere else entirely.
//
// WHAT REPLACED IT. The same arithmetic, read forwards, from the paginator's own numbers.
// A page's width is a property of the section the reader is IN, so that is what we compute
// and what we report. Measured on the two-fixture harness in
// tests/reader/page-geometry.spec.mjs.
let sectionSizes = []              // spine weights, in SectionProgress's own order
let sectionSizeTotal = 0
const sectionPages = new Map()     // section index → its content pages, once laid out

function readSectionSizes() {
  try {
    const sections = (view && view.book && view.book.sections) || []
    // progress.js:60, verbatim: a non-linear or zero-size section carries no weight, so it
    // occupies no fraction of the book and must not be given a page width.
    sectionSizes = sections.map((s) => (s && s.linear !== 'no' && s.size > 0 ? s.size : 0))
    sectionSizeTotal = sectionSizes.reduce((a, b) => a + b, 0)
  } catch (e) { sectionSizes = []; sectionSizeTotal = 0 }
}

// Readable pages in the section on screen. NOT `renderer.pages`: paginator.js:790 counts
// two blank pad pages either side of the text, which is why the paginator's own maths
// divides by pages − 2. That is the number of pages a reader can actually turn to.
function pagesInSection() {
  const r = view && view.renderer
  if (!r) return 0
  // Fixed layout: a section IS a page. fixed-layout.js:253 reports size:1 for exactly this
  // reason, and exposes no pagination to measure.
  if (view.isFixedLayout) return 1
  if (isScrolledFlow()) {
    // A "page" in scrolled flow is one screenful. Fractional by nature — the last
    // screenful of a section is rarely a whole one — and that is correct here: this is a
    // width, not a count.
    const size = r.size, viewSize = r.viewSize
    return size > 0 && viewSize > 0 ? Math.max(1, viewSize / size) : 0
  }
  const pages = r.pages
  return pages > 2 ? pages - 2 : 0
}

// Where the reader is within the current section, in whole pages, 1-based.
function pageInSection() {
  const r = view && view.renderer
  if (!r) return 1
  if (view.isFixedLayout) return 1
  if (isScrolledFlow()) return r.size > 0 ? Math.max(1, Math.floor(r.start / r.size) + 1) : 1
  return r.page >= 1 ? r.page : 1
}

// ONE PAGE, as a fraction of the WHOLE BOOK, for the section in front of the reader.
// 0 when the geometry is not knowable yet (nothing laid out, a book with no weights); the
// parent reads 0 as "keep the last good span, or fall back to the floor".
function pageSpanNow() {
  const pages = pagesInSection()
  if (!(pages > 0) || !(sectionSizeTotal > 0)) return 0
  const own = sectionSizes[currentIndex]
  if (!(own > 0)) return 0
  return (own / sectionSizeTotal) / pages
}

function computeMinLeft() {
  const w = sectionWords.get(currentIndex)
  const pages = pagesInSection()
  if (!w || !(pages > 0)) return null
  const frac = Math.min(1, Math.max(0, (pageInSection() - 1) / pages))
  return Math.max(0, Math.round((w * (1 - frac)) / 220))
}

// Pages per unit of section weight, measured over every section already laid out. This is
// the bridge between "I know this section exactly" and "I have never opened that one":
// sections the reader has visited contribute their real count, and the rest are estimated
// at the density those real counts imply. Cleared whenever the book re-paginates.
// A density measured over too little of the book is not an estimate, it is a guess. Measured
// on the uneven fixture: standing on the one-line half-title — 0.94% of the book's weight,
// one page — the density it implies alone says the book is 106 pages long. It is 15. So the
// total is withheld until the sections actually laid out account for this much of the book;
// one real chapter clears it immediately, and until then the footer prints the percentage
// alone rather than a number that is off by 7x.
const DENSITY_MIN_COVERAGE = 0.08

function pageDensity() {
  let pages = 0
  let size = 0
  for (const [index, count] of sectionPages) {
    const own = sectionSizes[index]
    if (own > 0 && count > 0) { pages += count; size += own }
  }
  if (!(size > 0) || !(sectionSizeTotal > 0)) return 0
  if (size / sectionSizeTotal < DENSITY_MIN_COVERAGE) return 0
  return pages / size
}

// Page X of Y. X is exact for every section the reader has actually paginated — which
// always includes the one they are on — and Y converges on the truth as they move through
// the book. Both are omitted (null) until enough of the book has been laid out to say
// anything honest about its length.
function computePages() {
  const density = pageDensity()
  if (!(density > 0) || !(sectionSizeTotal > 0)) return { cur: null, total: null }
  const total = Math.max(1, Math.round(sectionSizeTotal * density))
  let before = 0
  for (let i = 0; i < currentIndex; i++) {
    const known = sectionPages.get(i)
    before += known > 0 ? known : (sectionSizes[i] || 0) * density
  }
  const cur = Math.min(total, Math.max(1, Math.round(before) + pageInSection()))
  return { cur, total }
}

// Every section's page count is a function of the current typesetting, so a Typesetter tap
// or a flow switch invalidates all of them at once. Dropping the map is the honest move:
// averaging pre-change counts with post-change ones would produce a density that describes
// neither. The section on screen is re-recorded on the very next relocate.
function forgetPageGeometry() { sectionPages.clear() }

function applyStyles(patch) {
  Object.assign(state, patch)
  paintHost(state.bg)
  forgetPageGeometry()
  view?.renderer?.setStyles?.(buildCSS(state))
}

function setFlow(flow) {
  state.flow = flow === 'scrolled' ? 'scrolled' : 'paginated'
  forgetPageGeometry()
  view?.renderer?.setAttribute('flow', state.flow)
  view?.renderer?.setStyles?.(buildCSS(state))
}

function flattenTOC(items, level = 0, out = []) {
  if (!Array.isArray(items)) return out
  for (const it of items) {
    if (it && it.label) out.push({ label: String(it.label).trim(), href: it.href || null, level })
    if (it && it.subitems) flattenTOC(it.subitems, level + 1, out)
  }
  return out
}

// ── Tap zones: left/right thirds = page turn, centre = toggle the parent's chrome. ────
//
// R7.2 — ONE OWNER PER FLOW (recon §8.3). foliate's paginator binds its own touch handlers
// to this same section document (paginator.js:568-574) and, in PAGINATED flow, drags the
// columns and snaps to a page on release. Our old handler then turned the page a SECOND
// time on any |dx| > 50. So:
//   • paginated  → the paginator owns drags; we handle taps only and bail on any travel.
//   • scrolled   → the paginator early-returns on touch (paginator.js:842, :855), so the
//                  swipe is genuinely unhandled and ours to act on.
// `renderer.scrolled` reads the live `flow` attribute, so a mid-session Typesetter switch
// moves ownership with it.
//
// And the reason a centre tap used to do nothing on a phone: a tap fires touchend AND a
// synthesised click, so onTap ran twice and the chrome toggled straight back. The
// timestamp latch below swallows the compatibility click.
// ── OWNERSHIP BANDS (R7.2.3) ─────────────────────────────────────────────────
// Exactly one layer may act on a gesture. The boundary is not a distance alone, because a
// FLICK can travel almost no distance and still carry enough velocity for the paginator to
// snap a page — and if our tap zones also fired, one flick would move two pages.
//
//   BAND A — ours.        The paginator did not scroll AND travel <= TAP_SLOP.
//                         A true tap: no touchmove, so foliate's scrollBy never ran.
//                         → the left/centre/right zones apply.
//   BAND B — foliate's.   Anything else: the container scrolled, or travel exceeded the
//                         slop. Our layer is entirely inert, INCLUDING the click echo.
//
// The scroll test is what makes the bands exclusive rather than adjacent: it asks whether
// the other owner has already acted, instead of guessing from the gesture's shape.
// Paginated flow only — in scrolled flow the container scrolls natively on every swipe, so
// the same test would mute us permanently, and there the paginator declines the gesture
// anyway (paginator.js:842, :855).
const TAP_SLOP = 12              // px of travel still read as a tap, not a drag
const SCROLL_EPS = 0.5           // px of container movement that counts as "the paginator acted"
const CLICK_AFTER_TOUCH_MS = 700 // window in which a click is a touch's synthetic echo
let lastTouchEndAt = 0

// R7.2.1 — THE COORDINATE FIX, measured in tests/reader/tap-zones.spec.mjs.
//
// foliate expands the SECTION IFRAME to the whole column strip (paginator.js:377 —
// iframe.style.width = pageCount * size) and scrolls the container over it. So inside a
// section document, window.innerWidth is the width of the entire chapter, not of one page,
// and clientX is a position along that strip. Measured on the harness book at a 400px
// viewport, tapping dead centre (x=200):
//
//   page 1 | section innerWidth 1860 | frameLeft   +14 | clientX 186 → LEFT third
//   page 3 | section innerWidth 1860 | frameLeft  -730 | clientX 930 → CENTRE third
//   page 7 | section innerWidth 1860 | frameLeft  -358 | clientX 558 → LEFT third
//
// Same tap, three different zones. The relation is exact: clientX = tapX - frameLeft. So
// adding frameLeft back maps the coordinate into the READER's own viewport, where the
// thirds actually mean what they say. frameElement is the primitive rather than
// renderer.start/size because it carries the paginator's margins and gutters too, needs no
// knowledge of foliate's internals, and is correct in scrolled flow and RTL alike.
function toHostX(clientX, doc) {
  // The host document's own coordinates are already the reader's; only a nested section
  // document needs mapping, and mapping the host would wrongly add the reader iframe's
  // offset within the app page.
  if (!doc || doc === document) return clientX
  try {
    const frameEl = doc.defaultView && doc.defaultView.frameElement
    if (frameEl) return clientX + frameEl.getBoundingClientRect().left
  } catch (e) { /* cross-origin can't happen here; fall through */ }
  return clientX
}

function isScrolledFlow() {
  const r = view && view.renderer
  if (r && typeof r.scrolled === 'boolean') return r.scrolled
  return state.flow === 'scrolled'
}

// ── R11.21 — WHAT THE GLIDE CHANGED UNDERNEATH THE OWNERSHIP BANDS ────────────
//
// `animated` (set after open, below) makes a turn take 300ms instead of landing in one
// assignment. That is the whole point of it — but it also means `renderer.start` now moves
// for TWO reasons: a finger dragging the columns, and our own turn easing to the next page.
// Two rules in this file were written when only the first was possible, and both misread the
// second. MEASURED, not reasoned: two taps 40/60/80ms apart left the reader on the page they
// started on, having slid ~half a page forward and rubber-banded back.
//
//   1. THE BAND B SCROLL TEST (:1033). "Did the paginator move the page under this finger?"
//      became "did anything move the page", and a tap landing mid-glide answered yes — so our
//      layer disowned a gesture the paginator had not touched. Below, the test is skipped
//      while a turn of ours is in flight: that motion is ours, and already accounted for. The
//      TAP_SLOP distance test still separates a tap from a drag in that window, which is the
//      test that was doing the work anyway.
//
//   2. THE PAGINATOR'S OWN SNAP. paginator.js:853 snaps on EVERY touchend in paginated flow,
//      tap or drag. On a settled page that is a no-op — it targets the page already on screen
//      and #scrollTo returns at the equality check (:894). Mid-glide it is not: it reads the
//      interpolated position, and while the glide is in its first half that rounds to the page
//      BEHIND, so it animates back to where the turn started. Two animate() loops then write
//      the same scroll offset in the same frames and the later one wins. That is the fight.
//
// The fix is the R7.2.3 ownership rule extended from space into time: a gesture our layer
// claimed is ours including its snap, so we mute exactly that one. A drag is untouched — it
// never sets the flag, so its release still snaps, which is the only thing snap exists for.
//
// The mute is per-gesture and consumed immediately (the paginator schedules its snap in the
// very next frame after touchend), and a new touchstart clears it, so a snap that never
// arrives cannot leave the flag standing for the next reader's drag.
let turnsInFlight = 0
let muteNextSnap = false

// Every turn goes through here so the count is complete: taps, swipes in scrolled flow, the
// keyboard, and the chrome's own prev/next buttons all glide, and all of them move
// `renderer.start` without a finger. A turn the paginator drops (its #locked is held for the
// length of the glide) resolves immediately, so it increments and decrements without ever
// masking the real one still in flight.
function turnPage(dir) {
  if (!view) return
  turnsInFlight++
  Promise.resolve(dir < 0 ? view.goLeft() : view.goRight())
    .catch(() => {})
    .finally(() => { turnsInFlight-- })
}

// Wrapped on the public method, once, after open. The vendored foliate tree is pinned and its
// bytes are self-verifying (R11.18c), so the correction belongs on this side of the boundary.
function guardSnap(r) {
  if (!r || typeof r.snap !== 'function' || r.__calvarySnapGuarded) return
  const original = r.snap.bind(r)
  r.__calvarySnapGuarded = true
  r.snap = (vx, vy) => {
    if (muteNextSnap) { muteNextSnap = false; return }
    return original(vx, vy)
  }
}

// A release that ends a selection is not a tap (recon §8.4): no turn, no chrome.
function hasLiveSelection(doc) {
  try {
    const sel = (doc || document).getSelection()
    return !!sel && !sel.isCollapsed && String(sel).trim().length > 0
  } catch (e) { return false }
}

// R7.4 — the same question asked of the WHOLE reader rather than one document.
//
// A selection lives in the section document; the host document knows nothing about it. So
// `hasLiveSelection(document)` is always false at the host level, and the host's own click
// handler (which serves the margins outside the section, and any echo that lands on
// <foliate-view>) would happily turn a page while the reader had a word selected. That hole
// predates the chip — it is simply unreachable until something puts a control in the host
// document. It is closed here rather than worked around at the chip, because the rule is
// "a live selection means the tap layer is inert", and the rule should not depend on which
// document the finger happened to land in.
function anySelectionLive() {
  if (hasLiveSelection(document)) return true
  try {
    for (const c of (view && view.renderer && view.renderer.getContents && view.renderer.getContents()) || []) {
      if (c && c.doc && hasLiveSelection(c.doc)) return true
    }
  } catch (e) { /* no contents yet */ }
  return false
}

// R7.4.1 — the same reach, used to LET GO rather than to ask.
//
// WHY THE DEFINE TAP CLEARS THE SELECTION, ON EVERY PLATFORM. The selection is what keeps
// the platform's own menu on screen — iOS's Copy / Look Up callout, Android's action bar.
// Leaving it standing means the modal opens with a system menu floating over it, which no
// amount of z-index can fix: those menus are drawn by the OS, above the web view entirely.
// Collapsing the selection is the only instruction we have that dismisses them, and it is
// the right thing regardless: the reader asked for the definition, so the selection has
// served its purpose. Universal because the improvement is universal — this is not the iOS
// workaround, it is simply correct.
//
// The collapse fires selectionchange, which settles into hideChip(); the chip is already
// hidden by then, and the click echo the collapse would otherwise release is caught by the
// lastTouchEndAt latch fireDefine sets on the line above the call.
function clearAllSelections() {
  const clear = (d) => { try { const s = d && d.getSelection && d.getSelection(); if (s) s.removeAllRanges() } catch (e) {} }
  clear(document)
  try {
    for (const c of (view && view.renderer && view.renderer.getContents && view.renderer.getContents()) || []) {
      if (c && c.doc) clear(c.doc)
    }
  } catch (e) { /* nothing open */ }
}

function onTap(clientX, target, doc) {
  if (target && target.closest && target.closest('a[href]')) return // let links through
  if (hasLiveSelection(doc)) return
  const x = toHostX(clientX, doc)
  const w = window.innerWidth   // the READER's width — the surface the reader is touching
  if (x < w / 3) turnPage(-1)
  else if (x > (w * 2) / 3) turnPage(1)
  else post({ type: 'toggleChrome' })
}

// ── THE DEFINE CHIP (R7.4) ────────────────────────────────────────────────────
//
// WHY THIS CANNOT COLLIDE WITH THE TAP BANDS, and why that is structural rather than
// careful. The chip exists only while a selection is live, and a live selection is exactly
// the state in which BOTH tap paths are already inert — the same predicate, checked twice,
// written long before this feature:
//
//   touchend (:589)  `if (hasLiveSelection(detail.doc)) return`  — before either band test
//   onTap    (:404)  `if (hasLiveSelection(doc)) return`         — before the thirds
//
// So a long-press that selects a word cannot turn a page or toggle chrome, and a tap that
// COULD turn a page has, by definition, no selection and therefore no chip. The two paths
// are complements of one boolean, not neighbours separated by a margin. Band A and Band B
// are untouched: nothing below adds a listener to the section document's touch pipeline.
//
// AND THE CHIP ITSELF IS IN THE HOST DOCUMENT, not the section document. That is the second
// half of the guarantee. The host's own click handler (:617) acts only when
// `e.target === document.body || e.target === view`; a <button id="define-chip"> is neither,
// so tapping it is inert at the zone layer without needing a single special case. The
// section document never sees the event at all — different document, different listeners.
//
// The chip is positioned in HOST viewport coordinates. A selection rect comes from the
// section document, whose iframe foliate has expanded to the whole column strip and scrolled
// under the viewport (R7.2.1), so the rect must be offset by the frame's own box — the same
// correction toHostX applies to a tap, in both axes.
const SELECT_SETTLE_MS = 220     // quiet time after the last selection change
const CHIP_GAP = 8               // px between the word and the chip
const CHIP_MARGIN = 8            // px of viewport the chip may never cross
const SENTENCE_MAX = 320         // a quote, not a chapter

// ── R7.4.1 — THE CHIP AND THE iOS CALLOUT ────────────────────────────────────
//
// THE COLLISION. On iOS a text selection raises the system callout — Copy / Look Up /
// Translate — and iOS puts it directly ABOVE the selection, which is exactly where the chip
// was. The two overlap and the platform wins, because its menu is drawn by the OS above the
// web view. We do NOT try to suppress the callout: it is platform-owned, readers expect it,
// and every trick for killing it (-webkit-touch-callout, preventing selectstart) also breaks
// the selection the chip depends on. So the chip moves instead.
//
// AND IT MOVES ON iOS ONLY. Android Chrome's placement is glass-verified perfect: its action
// bar floats at the TOP of the viewport, nowhere near a chip sitting just above a word.
// Moving the chip everywhere to fix one platform would trade a verified-good surface for an
// unverified one. The non-Apple branch below is the R7.4 code, unchanged.
const IOS_HANDLE_CLEARANCE = 18  // px below the selection rect, to clear the grab-dots

// ── R7.4.2 — THE TOP ZONE: WHEN THE CALLOUT COMES DOWN TOO ───────────────────
//
// R7.4.1 predicted this edge and glass confirmed it. The callout is not unconditionally
// ABOVE the selection: it goes above WHEN THERE IS ROOM. Select a word on the first line or
// two of a page and there is none, so iOS relocates its own menu BELOW the selection —
// straight onto the chip that had just moved there to get out of its way. The platform and
// the chip chase each other into the same strip of paper.
//
// The chip yields again, and downwards, because there is nowhere else to go. Above is not
// available: the reason iOS moved is that the space above the selection is too small for a
// menu, and it is therefore too small for a chip. So in the top band the chip steps DOWN
// PAST the relocated callout — one placement, still below the word, just deeper.
//
// TWO DIALS, both glass-tuned, both stated here so the next round can turn them:
//
//   TOP_ZONE — how close to the top of the visible page a selection must be before iOS is
//   expected to have flipped its callout down. It is a threshold on the PLATFORM's decision,
//   which is not observable to us: nothing in the DOM reports where the callout went. 120 px
//   is the callout's own height (~50) plus its gap from the selection plus the margin iOS
//   keeps from the top of the web view — i.e. roughly the space the menu needs above a word
//   in order not to move. Slightly generous on purpose: a chip placed deep when the callout
//   in fact stayed above costs a reader nothing but a lower chip, whereas a chip placed
//   normally when the callout came down is the bug being fixed here.
//
//   CALLOUT_ALLOWANCE — how far past it. 64 px is the callout's approximate height plus
//   breathing room, so the chip reads as a separate object with daylight under the menu
//   rather than as its bottom row. Approximate because the callout's real geometry is
//   Apple's and is not exposed; this is measured off the glass, not derived.
//
// MEASURED FROM WHAT, EXACTLY. The zone test reads hostRect.top — the selection's distance
// from the top of the host's layout viewport. In THIS document that is the top of the visible
// page: html and body are height:100% with overflow:hidden, so the Reading Room never
// scrolls and the layout viewport is the visual one. A pinch-zoom is the only thing that can
// separate them, and it moves the chip's own `position:fixed` box by exactly the same offset
// — so correcting the threshold for visualViewport.offsetTop without correcting the placement
// would skew the test rather than sharpen it. One origin, used for both.
//
// Neither dial exists on any other platform: this whole branch is Apple-only, and Android's
// action bar (top of the viewport, nowhere near the word) is unaffected by both.
const TOP_ZONE = 120             // px from the top of the visible page: the band where iOS flips down
const CALLOUT_ALLOWANCE = 64     // px of extra drop, to clear the callout it flipped down

// Is this an Apple touch platform? Three tests, because Apple has changed the answer twice.
//
//   1. `navigator.platform` says iPhone/iPad/iPod — true on iOS through 12, and still true
//      on iPhone today.
//   2. The user agent says so — belt to that braces, and what a UA-emulating harness sets.
//   3. iPadOS 13+ DELIBERATELY reports itself as a Mac: platform is 'MacIntel' and the UA
//      says Macintosh, precisely so sites serve it the desktop experience. The only thing
//      that separates it from a real Mac is a touch screen — desktop Safari reports
//      maxTouchPoints 0, an iPad reports 5. An iPad raises the same callout an iPhone does,
//      so missing this case would leave the collision in place on the device most likely to
//      be reading a book.
//
// Evaluated per placement rather than once at load: it costs three regexes on a gesture that
// happens at most every few seconds, and it means nothing depends on script ordering.
function isAppleTouch() {
  try {
    const nav = navigator
    const platform = String(nav.platform || '')
    const ua = String(nav.userAgent || '')
    if (/^iP(hone|ad|od)/.test(platform)) return true
    if (/\biP(hone|ad|od)\b/.test(ua)) return true
    if (/Mac/.test(platform) && (nav.maxTouchPoints || 0) > 1) return true
    return false
  } catch (e) { return false }
}

const chipEl = document.getElementById('define-chip')
let settleTimer = null
let pendingWord = null           // { word, sentence } captured AT SELECTION TIME
let chipHold = false             // a finger is down on the chip: do not let go of it
let lastChipFireAt = 0

function toHostRect(rect, doc) {
  if (!doc || doc === document) return rect
  try {
    const frameEl = doc.defaultView && doc.defaultView.frameElement
    if (frameEl) {
      const f = frameEl.getBoundingClientRect()
      return {
        left: rect.left + f.left, top: rect.top + f.top,
        right: rect.right + f.left, bottom: rect.bottom + f.top,
        width: rect.width, height: rect.height,
      }
    }
  } catch (e) { /* same-origin only; fall through */ }
  return rect
}

// The coarse gate: is this ONE word? The parent owns the real normalisation
// (app/lib/dictionary.js) because that is where the lookup happens and there must be one
// authority for what a headword is. The host only decides whether to offer the chip, so
// punctuation rides along untouched and the parent strips it.
function selectionWord(raw) {
  const w = String(raw == null ? '' : raw).trim()
  if (!w || w.length > 60) return ''
  if (/\s/.test(w)) return ''            // more than one word — the chip is single-word only
  if (!/\p{L}/u.test(w)) return ''       // a lone comma or numeral is not a word
  return w
}

const BLOCK_TAGS = new Set(['P', 'DIV', 'LI', 'BLOCKQUOTE', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6',
  'TD', 'SECTION', 'ARTICLE', 'FIGCAPTION', 'DD', 'DT', 'PRE', 'BODY'])

// EPUB content documents are XHTML, and in an XML document `tagName` PRESERVES CASE — the
// heading above is `h1`, never `H1`. Uppercasing here is what makes this work on a real book
// at all: measured in tests/reader/define-chip.spec.mjs, the uppercase-only test walked
// straight past `body` to `html`, returned null, and every anchored quote in the product
// would have been empty.
function blockAncestor(node) {
  let el = node && node.nodeType === 3 ? node.parentElement : node
  while (el && el.tagName && !BLOCK_TAGS.has(el.tagName.toUpperCase())) el = el.parentElement
  return el || null
}

// Absolute character offset of (node, offset) within the block's textContent. Walking the
// text nodes is the only way to get this: textContent flattens inline markup, so an offset
// inside an <em> means nothing without knowing how much text preceded it.
function offsetInBlock(block, node, offset) {
  try {
    const walker = block.ownerDocument.createTreeWalker(block, NodeFilter.SHOW_TEXT, null)
    let total = 0, n
    while ((n = walker.nextNode())) {
      if (n === node) return total + offset
      total += n.nodeValue.length
    }
  } catch (e) { /* fall through */ }
  return -1
}

// THE ANCHORED QUOTE — the tapped word's own sentence, so the modal can show the word at
// work rather than in isolation.
//
// Sentence detection is a terminator scan, and it is deliberately naive: "Mr. Ferryman"
// will cut at the abbreviation. The alternative is a list of honorifics per language, which
// is a large amount of machinery to slightly improve a quote that is already only context.
// Cutting early yields a SHORTER true fragment of the book, never a wrong one.
function sentenceAround(range) {
  try {
    const block = blockAncestor(range.startContainer)
    if (!block) return ''
    const raw = block.textContent || ''
    const s = offsetInBlock(block, range.startContainer, range.startOffset)
    const e = offsetInBlock(block, range.endContainer, range.endOffset)
    if (s < 0 || e < 0) return ''
    let from = 0
    for (let i = s - 1; i > 0; i--) {
      if (/[.!?…]/.test(raw[i]) && /\s/.test(raw[i + 1] || ' ')) { from = i + 1; break }
    }
    let to = raw.length
    for (let i = e; i < raw.length; i++) {
      if (/[.!?…]/.test(raw[i])) { to = i + 1; break }
    }
    let out = raw.slice(from, to).replace(/\s+/g, ' ').trim()
    // An unpunctuated block (verse, a heading) can run the whole way; keep the word's
    // neighbourhood rather than the whole page.
    if (out.length > SENTENCE_MAX) {
      const mid = Math.max(0, s - from)
      const start = Math.max(0, mid - SENTENCE_MAX / 2)
      out = (start > 0 ? '… ' : '') + out.slice(start, start + SENTENCE_MAX).trim() + ' …'
    }
    return out
  } catch (e) { return '' }
}

function hideChip() {
  chipEl.classList.remove('show')
}

function showChipAt(hostRect, doc) {
  chipEl.classList.add('show')
  const cw = chipEl.offsetWidth || 96
  const ch = chipEl.offsetHeight || 44
  const vw = window.innerWidth
  const vh = window.innerHeight
  let top
  let left

  if (isAppleTouch()) {
    // ── iOS: BELOW the selection, out from under the callout. ────────────────
    // The vertical offset has to clear the selection's lower grab-dots, not merely the text:
    // iOS draws the end handle as a knob CENTRED on the bottom edge of the selection rect, so
    // roughly half of it hangs below the rect the DOM reports. IOS_HANDLE_CLEARANCE is that
    // overhang plus enough air that the chip does not read as attached to the handle. It is a
    // glass-tuned number — the knob's real size is not exposed to us.
    top = hostRect.bottom + IOS_HANDLE_CLEARANCE
    // THE TOP ZONE AND THE FLIP ARE MUTUALLY EXCLUSIVE, and the if/else is what makes that a
    // fact rather than an intention. Both branches answer "there is not enough room" and they
    // answer it in OPPOSITE directions, so a shape that let them both run would place the
    // chip above a word precisely in the band where above is known to be too tight — the one
    // outcome this round exists to prevent. In the top zone the chip goes deeper and the
    // shared clamp below is the only thing that may still move it.
    if (hostRect.top < TOP_ZONE) {
      // R7.4.2: iOS has relocated its callout below the selection. Step down past it.
      top += CALLOUT_ALLOWANCE
    } else if (top + ch > vh - CHIP_MARGIN) {
      // FLIP ONLY WHEN THERE IS NO ROOM. The bottom-line case: a word on the last line of the
      // page has no space beneath it, and a chip clamped to the viewport floor would sit ON the
      // selection. Above is the lesser evil there — the callout may overlap, but the reader can
      // still see both, whereas a chip on top of the word hides the thing being defined.
      top = hostRect.top - ch - CHIP_GAP
    }
    // Horizontally near the selection's END, not its centre: that is where the reader's
    // attention and thumb already are after a long-press, and it keeps the chip from sitting
    // symmetrically under a callout that is itself centred on the word.
    const rtl = (() => {
      try {
        const el = doc && doc.documentElement
        if (!el) return false
        if ((el.getAttribute('dir') || '').toLowerCase() === 'rtl') return true
        return (doc.defaultView.getComputedStyle(doc.body || el).direction === 'rtl')
      } catch (e) { return false }
    })()
    const endX = rtl ? hostRect.left : hostRect.right
    left = endX - cw / 2
  } else {
    // ── Everything else: R7.4's placement, untouched. ────────────────────────
    // Above the word by preference — that is where the reader's finger is NOT.
    top = hostRect.top - ch - CHIP_GAP
    if (top < CHIP_MARGIN) top = hostRect.bottom + CHIP_GAP     // no room above → below it
    left = hostRect.left + hostRect.width / 2 - cw / 2          // centred on the word
  }

  // The clamp is shared, and applies on every platform: whatever the policy above decided,
  // the chip may not cross any edge of the viewport.
  top = Math.min(Math.max(CHIP_MARGIN, top), Math.max(CHIP_MARGIN, vh - ch - CHIP_MARGIN))
  left = Math.min(Math.max(CHIP_MARGIN, left), Math.max(CHIP_MARGIN, vw - cw - CHIP_MARGIN))
  chipEl.style.left = Math.round(left) + 'px'
  chipEl.style.top = Math.round(top) + 'px'
}

function settleSelection(doc) {
  if (chipHold) return          // the reader is pressing the chip; the selection may go
  let sel = null
  try { sel = (doc || document).getSelection() } catch (e) { sel = null }
  if (!sel || sel.isCollapsed || sel.rangeCount === 0) { pendingWord = null; hideChip(); return }
  const word = selectionWord(String(sel))
  if (!word) { pendingWord = null; hideChip(); return }
  const range = sel.getRangeAt(0)
  const rect = range.getBoundingClientRect()
  if (!rect || (!rect.width && !rect.height)) { pendingWord = null; hideChip(); return }
  const sentence = sentenceAround(range)
  pendingWord = { word, sentence }
  const hostRect = toHostRect(rect, doc)
  showChipAt(hostRect, doc)
  // The parent gets the fact even though the chip is ours: it is what lets a register log,
  // debug or (later) act on a selection without reaching into this document.
  post({ type: 'wordSelected', word, sentence, rect: {
    left: Math.round(hostRect.left), top: Math.round(hostRect.top),
    width: Math.round(hostRect.width), height: Math.round(hostRect.height),
  } })
}

function watchSelection(doc) {
  const onChange = () => {
    if (settleTimer) clearTimeout(settleTimer)
    settleTimer = setTimeout(() => settleSelection(doc), SELECT_SETTLE_MS)
  }
  try { doc.addEventListener('selectionchange', onChange) } catch (e) { /* noop */ }
  // A new touch on the page means the reader has moved on from the last selection.
  try { doc.addEventListener('touchstart', () => { if (!chipHold) hideChip() }, { passive: true }) } catch (e) {}
}

function fireDefine() {
  // Idempotent: pointerup and the click that follows it are one intent, and Playwright's
  // .click() dispatches both. Same shape as the CLICK_AFTER_TOUCH_MS latch above.
  if (Date.now() - lastChipFireAt < 500) return
  if (!pendingWord) return
  lastChipFireAt = Date.now()
  // Swallow the chip tap's own click echo with the SAME latch the tap zones use. Measured:
  // preventDefault on pointerdown stops the BUTTON being the click target, and by the time
  // the compatibility click is dispatched the chip has hidden itself — so the echo lands on
  // <foliate-view>, which the host's click handler acts on, and a define turned into a
  // chrome toggle. The latch is the mechanism already in place for exactly this class of
  // ghost; reusing it keeps one answer to "was that a real click?" rather than two.
  lastTouchEndAt = Date.now()
  post({ type: 'defineWord', word: pendingWord.word, sentence: pendingWord.sentence })
  hideChip()
  // R7.4.1 — let the selection go, so the platform's own menu goes with it. See
  // clearAllSelections. Ordered AFTER the post so nothing about the request depends on it,
  // and after the latch so the resulting click echo is already covered.
  clearAllSelections()
}

// preventDefault on pointerdown is what keeps the chip tappable at all: without it the
// press collapses the selection, selectionchange fires, and the chip removes itself out
// from under the finger before pointerup can land.
chipEl.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); chipHold = true })
chipEl.addEventListener('pointerup', (e) => { e.preventDefault(); e.stopPropagation(); chipHold = false; fireDefine() })
chipEl.addEventListener('pointercancel', () => { chipHold = false })
chipEl.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); fireDefine() })

// ── THE LOAD FENCE (R7.3, recon §8.19) ────────────────────────────────────────
//
// THE FOREVER-SPINNER. foliate's loader is fetch(url) → res.blob() → new File(...)
// (view.js:70-75, makeBook). It has no fence of any kind: a request that answers with a
// status code fails loudly, but a request that never answers at all, or one whose body
// stops arriving halfway, leaves "Opening book…" spinning for as long as the reader is
// willing to look at it. There is no timeout, no error, and nothing for the register above
// to report.
//
// So we do the fetch here and hand foliate the same File its own makeBook() would have
// built — same object, same name, identical code path from that point on — which is what
// makes every failure a fact with a reason attached.
//
// TWO fences, and deliberately NOT a cap on the download as a whole. A 30 MB book on a
// train is slow, not broken, and cutting it off would be exactly the mistake public/sw.js's
// timeout rule exists to prevent: turning a working connection into an apology.
//   • HEADERS — nothing answered at all within OPEN_HEADERS_MS: the file is not coming.
//   • STALL   — the body stopped arriving for OPEN_STALL_MS: the connection died mid-file.
// Every chunk re-arms the stall clock, so a slow-but-moving download runs as long as it
// needs to. A book that is genuinely arriving is never interrupted.
//
// `?fencems=` shortens both, for the harness only (tests/reader/load-fence.spec.mjs):
// waiting out a real 20 s stall in every CI run would cost more than the test is worth. It
// is deliberately harmless in the wild — the only thing a reader could do by setting it is
// give up on their own book sooner than we would have.
const FENCE_OVERRIDE = (() => {
  const n = parseInt(params.get('fencems') || '', 10)
  return Number.isFinite(n) && n > 0 ? n : null
})()
const OPEN_HEADERS_MS = FENCE_OVERRIDE ?? 20000
const OPEN_STALL_MS = FENCE_OVERRIDE ?? 20000

class BookLoadError extends Error {
  constructor(reason, message) { super(message || reason); this.reason = reason }
}

async function fetchBookFile(src) {
  const controller = new AbortController()
  const headerTimer = setTimeout(() => controller.abort(), OPEN_HEADERS_MS)
  let res
  try {
    res = await fetch(src, { signal: controller.signal })
  } catch (e) {
    throw new BookLoadError(controller.signal.aborted ? 'no-answer' : 'network', String((e && e.message) || e))
  } finally {
    clearTimeout(headerTimer)
  }
  if (!res.ok) throw new BookLoadError('http', `${res.status} ${res.statusText}`)

  // foliate names the File after the response's full pathname (view.js:74). Kept verbatim:
  // makeBook branches on the name's extension for CBZ and FBZ, so the name is load-bearing.
  let name = 'book.epub'
  try { name = new URL(res.url).pathname || name } catch (e) { /* keep the default */ }

  // An opaque or bodyless response cannot be watched for progress. Take it whole — which is
  // what foliate would have done anyway — rather than refusing to open a readable book.
  if (!res.body || typeof res.body.getReader !== 'function') {
    const blob = await res.blob()
    const whole = new File([blob], name)
    if (!whole.size) throw new BookLoadError('empty', 'the file was empty')
    return whole
  }

  const reader = res.body.getReader()
  const chunks = []
  let stallTimer = null
  let stalled = false
  // ABORT, not reader.cancel(). cancel() is the GRACEFUL close: per the streams spec it
  // fulfils the pending read() with { done: true } rather than rejecting it, so the loop
  // below would fall out of its `if (done) break` believing the body had finished. A
  // stalled 30 MB book then became a truncated File that foliate rejected further down as
  // 'unreadable' — a real failure reported under the wrong name, and the wrong name is the
  // one thing this fence exists to get right. Aborting the controller errors the body
  // stream, which is what makes read() actually reject.
  const arm = () => {
    if (stallTimer) clearTimeout(stallTimer)
    stallTimer = setTimeout(() => { stalled = true; try { controller.abort() } catch (e) {} }, OPEN_STALL_MS)
  }
  try {
    arm()
    for (;;) {
      const { done, value } = await reader.read()
      if (done) break
      if (value) chunks.push(value)
      arm()   // progress: the clock starts again from here
    }
  } catch (e) {
    // Only OUR timer means 'stalled'. Anything else that kills a body mid-flight — a reset
    // connection, a decoding failure — is a network fault, and saying so keeps the log line
    // honest about which fence fired.
    throw new BookLoadError(stalled ? 'stalled' : 'network', String((e && e.message) || e))
  } finally {
    if (stallTimer) clearTimeout(stallTimer)
  }
  const file = new File(chunks, name)
  if (!file.size) throw new BookLoadError('empty', 'the file was empty')
  return file
}

// One exit for every way this can go wrong. The register above renders the reader-facing
// state (it is the only layer that knows where this reader should be sent); the `reason`
// travels with the message so a log line can name the failure without guessing.
function showFailure(reason, message) {
  console.error('[reading-room] could not open the book:', reason, message || '')
  document.getElementById('loading').classList.add('hidden')
  document.getElementById('error').classList.add('show')
  post({ type: 'error', reason: reason || 'unknown', message: message || null })
}

if (!url) {
  showFailure('no-target', 'No book URL provided.')
} else {
  view = document.createElement('foliate-view')
  document.body.append(view)

  view.addEventListener('relocate', ({ detail }) => {
    const fraction = detail.fraction ?? 0
    lastCFI = detail.cfi || view.lastLocation?.cfi || lastCFI
    lastChapter = detail.tocItem?.label || lastChapter
    if (detail.tocItem && detail.tocItem.href) lastChapterHref = detail.tocItem.href
    lastRange = detail.range || lastRange
    lastFraction = fraction
    // The section has now been laid out, so its page count is real. Recorded here rather
    // than on 'load': at load time the paginator has not measured anything yet.
    const laidOut = pagesInSection()
    if (currentIndex >= 0 && laidOut > 0) sectionPages.set(currentIndex, laidOut)
    const { cur, total } = computePages()
    post({
      type: 'relocate', cfi: lastCFI, fraction,
      chapterLabel: lastChapter || null,
      // R7.3 (§8.7), additive: the parent already compares this against the TOC it was
      // handed at ready, so the Contents panel's .current comparison comes alive with it.
      chapterHref: lastChapterHref,
      pageCurrent: cur, pageTotal: total,
      pct: Math.round(fraction * 100),
      minLeft: computeMinLeft(),
      // R7.3: ONE PAGE OF THIS SECTION, as a fraction of the whole book — real geometry,
      // not the smallest step ever seen. The parent derives its "is a ribbon on THIS page"
      // epsilon from it. See the geometry block above for why the old ruler was wrong.
      pageSpan: pageSpanNow(),
    })
    if (!endedFired && fraction >= 0.999) { endedFired = true; post({ type: 'ended' }) }
    // R7.4: the page moved, so the word the chip was offered for is no longer under it.
    if (!chipHold) { pendingWord = null; hideChip() }
  })

  view.addEventListener('load', ({ detail }) => {
    // R4a.2 fault A — ROOT CAUSE FIX. foliate's load pipeline is:
    //   afterLoad(doc) → paginator.setStyles(its own stored styles) → dispatch 'load' (this
    //   handler, synchronously) → getBackground(doc) → paint the grid margins with it.
    // On the FIRST section the paginator's stored styles are still undefined (we only called
    // setStyles in open().then(), which resolves later), so it sampled the EPUB's own white
    // background and painted the margin gutters white — the white L-shape around the page.
    // Re-asserting our CSS here lands it in the document before that sample is taken.
    view.renderer?.setStyles?.(buildCSS(state))
    respectAuthorAlignment(detail.doc)
    currentIndex = detail.index
    if (!sectionWords.has(currentIndex)) sectionWords.set(currentIndex, countWords(detail.doc))
    // Tap + swipe on the section document. See the ownership note above onTap.
    let tx = null, ty = null, tScroll = null
    detail.doc.addEventListener('touchstart', (e) => {
      const t = e.touches[0]
      tx = t ? t.clientX : null
      ty = t ? t.clientY : null
      tScroll = view && view.renderer ? view.renderer.start : null
      muteNextSnap = false   // R11.21 — a new gesture never inherits the last one's mute
    }, { passive: true })
    detail.doc.addEventListener('touchend', (e) => {
      // R7.2.1/R7.2.3: latch on EVERY touch end, BEFORE any guard — including the
      // `no touchstart seen` one. Measured: a drag our handler correctly declined still
      // produced a compatibility click, which fell through to onTap and turned a second
      // page. What must be suppressed is the echo of a touch sequence, not of a handled tap.
      lastTouchEndAt = Date.now()
      if (tx === null) return
      const startX = tx, startY = ty
      const startScroll = tScroll
      tx = null; ty = null; tScroll = null
      const t = e.changedTouches[0]
      const dx = startX - (t ? t.clientX : startX)
      const dy = startY - (t ? t.clientY : startY)
      if (hasLiveSelection(detail.doc)) return
      // BAND B, first test: did the paginator already move the page under this finger?
      // R11.21 — not asked while a turn of ours is gliding: the page moved because we are
      // moving it, and reading that as the paginator acting disowns a gesture it never saw.
      if (!isScrolledFlow() && !turnsInFlight && startScroll !== null && view && view.renderer
        && Math.abs(view.renderer.start - startScroll) > SCROLL_EPS) return
      if (isScrolledFlow()) {
        // Ours: the paginator did not act on this gesture.
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
          turnPage(dx > 0 ? 1 : -1)
          return
        }
      } else if (Math.abs(dx) > TAP_SLOP || Math.abs(dy) > TAP_SLOP) {
        return // BAND B by distance — the paginator owns it
      }
      // BAND A, claimed. The snap the paginator schedules for this touchend is ours to
      // cancel — see the R11.21 note above turnPage.
      muteNextSnap = true
      onTap(startX, e.target, detail.doc)
    })
    detail.doc.addEventListener('click', (e) => {
      if (Date.now() - lastTouchEndAt < CLICK_AFTER_TOUCH_MS) return
      onTap(e.clientX, e.target, detail.doc)
    })
    detail.doc.addEventListener('keydown', handleKey)
    // R7.4: the define chip's selection watch. Bound alongside the touch handlers and
    // deliberately AFTER them, so the reading order of this block matches the ownership
    // note: the bands are established first, and the chip lives in the state they decline.
    watchSelection(detail.doc)
  })

  function handleKey(e) {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'h') turnPage(-1)
    else if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'l') turnPage(1)
  }
  document.addEventListener('keydown', handleKey)
  // Host-frame taps (margins outside the section doc) also route through the zone logic.
  document.addEventListener('click', (e) => {
    if (Date.now() - lastTouchEndAt < CLICK_AFTER_TOUCH_MS) return
    if (anySelectionLive()) return          // R7.4 — see anySelectionLive
    if (e.target === document.body || e.target === view) onTap(e.clientX, e.target, document)
  })

  ;(async () => {
    // Two separately reportable failures: the file never arrived, or it arrived and is not
    // a book we can read. They are different sentences to a reader, so they stay apart.
    let file
    try {
      file = await fetchBookFile(url)
    } catch (err) {
      showFailure(err instanceof BookLoadError ? err.reason : 'network', String((err && err.message) || err))
      return
    }
    try {
      await view.open(file)
    } catch (err) {
      showFailure('unreadable', String((err && err.message) || err))
      return
    }
    // The spine weights are only knowable once the book is open, and every page-geometry
    // answer depends on them, so this must land before the first relocate.
    readSectionSizes()
    view.renderer?.setStyles?.(buildCSS(state))
    view.renderer?.setAttribute?.('flow', state.flow)
    view.renderer?.next()
    // R11.21 — THE PAGE-TURN GLIDE. `animated` is foliate's own switch (paginator.js:901): it
    // is what lets #scrollTo take the 300ms easeOutQuad branch instead of assigning
    // scrollLeft outright. The hard assignment is where the flash comes from — the columns
    // jump and the eye catches the seam, worst on the dark papers. This is the same
    // one-attribute change the app shipped today, at the web's equivalent of applyPrefs: the
    // renderer is created once, in view.open (view.js:256-267), so this block is the only
    // place a renderer is guaranteed to exist and nothing ever recreates it.
    //
    // SET AFTER `next()`, DELIBERATELY. The line above is not a reader's turn — it is the
    // open positioning off foliate's blank leading page, and it fires in the same tick as the
    // loading overlay hiding on the line below. Animating it would glide the first page in
    // from the right underneath a screen that is still disappearing. #turnPage reads
    // hasAttribute('animated') synchronously before its first await, so the ordering here is
    // exact, not hopeful: the open jump is instant and every turn after it glides.
    //
    // Only two paths reach the animated branch — `smooth` (set solely by #scrollPrev/
    // #scrollNext, i.e. every prev/next turn) and reason==='snap' (the drag release). Seeks
    // do not: goTo → #display → scrollToAnchor carries reason 'anchor'/'navigation'/
    // 'selection' and never passes smooth, so resume and bookmark jumps stay instant.
    view.renderer?.setAttribute?.('animated', '')
    guardSnap(view.renderer)
    document.getElementById('loading').classList.add('hidden')
    ready = true
    const toc = flattenTOC(view.book?.toc || [])
    const title = (() => { const t = view.book?.metadata?.title; return typeof t === 'string' ? t : (t && Object.values(t)[0]) || '' })()
    post({ type: 'ready', toc, title })
    // Ready-gated restore (PART 1 race hardening): apply the queued target now. CFI wins over
    // the coarse fraction fallback.
    if (pendingGoTo) { const t = pendingGoTo; pendingGoTo = null; try { view.goTo(t) } catch (e) {} }
    else if (pendingFraction != null) { const f = pendingFraction; pendingFraction = null; try { view.goToFraction(f) } catch (e) {} }
  })()
}

// Re-apply typesetting only when the justification decision actually flips (rotation, iPad split
// view, desktop resize) — foliate re-paginates on setStyles, so we must not do it on every tick.
let lastJustify = effectiveJustify(state)
window.addEventListener('resize', () => {
  const now = effectiveJustify(state)
  if (now === lastJustify) return
  lastJustify = now
  forgetPageGeometry()   // a justification flip re-paginates every section
  view?.renderer?.setStyles?.(buildCSS(state))
})

// ── Parent → host bridge (origin-checked) ──────────────────────────────────────
window.addEventListener('message', async (e) => {
  if (e.origin !== PARENT_ORIGIN) return
  const d = e.data || {}
  switch (d.type) {
    case 'applyStyles': applyStyles(d); break
    case 'setFlow': setFlow(d.flow); break
    case 'prev': turnPage(-1); break
    case 'next': turnPage(1); break
    // R7.2.2: every navigation now ACKS. view.goTo is async, and the old synchronous
    // try/catch could not catch its rejection — a CFI that failed to resolve died in
    // silence, with nothing in the console and nothing for the parent to act on. The ack
    // makes the failure a fact the parent can respond to (it falls back to the record's
    // fraction), and makes the whole chain visible under ?rrdebug=1.
    case 'goTo': {
      const id = d.id ?? null
      if (!d.cfi) { post({ type: 'goToAck', id, ok: false, reason: 'no-target' }); break }
      if (!ready) { pendingGoTo = d.cfi; post({ type: 'goToAck', id, ok: true, reason: 'queued' }); break }
      Promise.resolve()
        .then(() => view.goTo(d.cfi))
        .then(() => post({ type: 'goToAck', id, ok: true }))
        .catch((err) => post({ type: 'goToAck', id, ok: false, reason: 'unresolved', message: String(err && err.message || err) }))
      break
    }
    case 'goToFraction': {
      const id = d.id ?? null
      if (typeof d.fraction !== 'number') { post({ type: 'goToAck', id, ok: false, reason: 'no-target' }); break }
      if (!ready) { pendingFraction = d.fraction; post({ type: 'goToAck', id, ok: true, reason: 'queued' }); break }
      Promise.resolve()
        .then(() => view.goToFraction(d.fraction))
        .then(() => post({ type: 'goToAck', id, ok: true }))
        .catch((err) => post({ type: 'goToAck', id, ok: false, reason: 'unresolved', message: String(err && err.message || err) }))
      break
    }
    // R7.2: the round trip that shipped orphaned in R4a now carries everything a ribbon
    // record needs. `excerpt` is the current page's own opening words, so a ribbon reads
    // as the passage it marks rather than as 'Bookmarked passage'.
    case 'requestBookmark':
      post({
        type: 'bookmarkCFI',
        cfi: lastCFI,
        chapterLabel: lastChapter || null,
        fraction: lastFraction,
        excerpt: pageExcerpt(),
      })
      break
    case 'clearSearch':
      try { view?.clearSearch?.() } catch (err) {}
      break
    // R7.4: the parent opened the definition modal, so the chip has done its job. Also the
    // register's way to retract it on any panel opening, since the chip must never sit on
    // top of a sheet.
    case 'dismissChip':
      chipHold = false
      pendingWord = null
      hideChip()
      break
    // ══ DO NOT REPLACE Overlayer.highlight WITH A <mark>-WRAPPING HIGHLIGHTER ══
    //
    // This is the load-bearing property of the whole search feature, and it is invisible in
    // the code that depends on it — so it is written here, where a search change arrives.
    //
    // Overlayer owns its own <svg> layer and paints highlights on top of the section
    // document. It NEVER TOUCHES THE CONTENT DOM. That is why a CFI emitted on this surface
    // means the same thing on the mobile app: a CFI is a path through the document tree plus
    // a character offset into a text node, so it is only stable while the tree and the text
    // nodes are.
    //
    // The obvious "improvement" — wrap each hit in <mark> (or any span, or Range.surround-
    // Contents, or innerHTML with the match tagged) — SPLITS THE TEXT NODE AT THE MATCH and
    // inserts an element. Every CFI after that point in the section now resolves somewhere
    // else: child indices shift by the inserted element, and the offset that used to land
    // mid-sentence now lands in the wrong node entirely. Nothing throws. The reader simply
    // resumes a few words or a few paragraphs off, and every bookmark taken while a search
    // was active is quietly wrong — including ones already stored in readerBookmarks.
    //
    // It is silent, it is retroactive, and it breaks the cross-surface CFI exchange (§6h) by
    // making the two surfaces disagree about a book they are both reading correctly.
    //
    // If you need a different highlight look, change drawOptions or write another draw
    // function that also paints in an overlay. The constraint is not "use Overlayer"; it is
    // THE CONTENT DOCUMENT IS READ-ONLY DURING SEARCH.
    case 'search': {
      const token = ++searchToken
      const query = (d.query || '').trim()
      if (!query) { post({ type: 'searchResults', id: d.id, results: [], done: true, truncated: false }); break }
      const results = []
      const CAP = 50
      try {
        try { view?.clearSearch?.() } catch (err) {}
        for await (const r of view.search({ query, draw: Overlayer.highlight, drawOptions: { color: '#c9a44c' } })) {
          if (token !== searchToken) return // superseded by a newer search
          if (r === 'done') break
          if (r && r.subitems) {
            for (const s of r.subitems) {
              if (!s?.cfi) continue
              const ex = s.excerpt || {}
              results.push({ cfi: s.cfi, pre: ex.pre || '', match: ex.match || query, post: ex.post || '', chapterLabel: r.label || null })
              if (results.length >= CAP) break
            }
          } else if (r && r.cfi) {
            const ex = r.excerpt || {}
            results.push({ cfi: r.cfi, pre: ex.pre || '', match: ex.match || query, post: ex.post || '', chapterLabel: null })
          }
          if (results.length >= CAP) break
        }
        post({ type: 'searchResults', id: d.id, results, done: true, truncated: results.length >= CAP })
      } catch (err) {
        console.error('[reading-room] search failed', err)
        post({ type: 'searchResults', id: d.id, results, done: true, truncated: false })
      }
      break
    }
  }
})
</script>
