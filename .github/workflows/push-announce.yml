# ═══════════════════════════════════════════════════════════════════════════════
# PUSH ANNOUNCE — one notification per story or instalment, when it first becomes visible.
# ═══════════════════════════════════════════════════════════════════════════════
#
# ⚡ ARMED (W8, 25 Sep 2026). THE `schedule:` BLOCK BELOW IS THE SWITCH.
#
# Same discipline as square-horizon.yml: commenting the two schedule lines out, in a
# commit, is how this is disarmed. Do not disable it from the Actions UI, which anyone can
# re-enable. The seed was written immediately before this was armed
# (ops/push_announcer/seededAt); without it the announcer refuses to send at all.
#
# What a scheduled run does, every 15 minutes (docs/PUSH-GO-LIVE.md):
#   · receipts for earlier tickets, then prunes dead and stale devices;
#   · anything visible and never announced is due — but nothing leaves before 08:00
#     London (held, sent on the first run after), and at most two go out per London
#     day (a third is recorded `capped` and never sent);
#   · writes ops/push_announcer/lastRunAt — the heartbeat W7's launch check reads.
#
# WHY HERE AND NOT A CLOUDFLARE WORKER
# ────────────────────────────────────
# The payload builder, the {form} table and the visibility predicates live in this repo
# and are imported, not transcribed — the lesson of the index reconciler (a Worker
# cannot import app/lib, and its hand-copy drifted). The Workers are dashboard-edited
# with no review or history, and no Cloudflare credential exists in this Codespace.
# FIREBASE_SERVICE_ACCOUNT is already a repo secret (covers.yml, index-reconcile.yml).
#
# THE COST OF THAT CHOICE, STATED
# ───────────────────────────────
# · Latency: */15, and GitHub's scheduler is best-effort — a story can reach readers'
#   phones up to ~20 minutes after it goes live. A story scheduled before 08:00 London
#   is held by ruling and announced on the 08:00 run (08:00–~08:20).
# · GitHub DISABLES scheduled workflows after 60 days without repository activity, and a
#   disabled cron produces NO RUN — silence looks exactly like a quiet news week. The
#   heartbeat is ops/push_announcer/lastRunAt, and W7's launch check (scripts/launch-check.mjs)
#   turns red when it is older than 45 minutes while this schedule is armed. Commits land here most days, so the 60-day window has never been
#   close, but it is a real failure mode and it would fail SILENTLY.
name: push announce

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run (read only) · frequency · seed-dry-run · seed (WRITES, once) · apply (SENDS)'
        required: true
        default: dry-run
        type: choice
        options: [dry-run, frequency, seed-dry-run, seed, apply]
  push:
    branches: [main]
    paths:
      - 'scripts/push/**'
      - 'scripts/push-test.mjs'
      - 'tests/push/**'
      - 'app/lib/taxonomy.js'
      - '.github/workflows/push-announce.yml'
  pull_request:
    paths:
      - 'scripts/push/**'
      - 'scripts/push-test.mjs'
      - 'tests/push/**'
      - 'app/lib/taxonomy.js'
      - '.github/workflows/push-announce.yml'

# Two runs cannot double-send (the claim is a transaction) but there is no reason to let
# them overlap. Never cancel mid-send.
concurrency:
  group: push-announce
  cancel-in-progress: false

jobs:
  verify:
    name: announcer suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Scan, seed, audience, payload, receipts, pruning
        run: npm run test:push
      - name: Claims, retries and concurrency against the RTDB emulator
        run: npm run test:push:emulator

  announce:
    name: announce
    needs: verify
    # Never on a push or a PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Write the service account
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not set."
            exit 1
          fi
          printf '%s' "$KEY" > "${RUNNER_TEMP}/serviceAccountKey.json"

      - name: Announce
        env:
          PUSH_SERVICE_ACCOUNT: ${{ runner.temp }}/serviceAccountKey.json
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
          MODE: ${{ github.event_name == 'schedule' && 'apply' || inputs.mode }}
        shell: bash   # pipefail: the script's own exit status still fails the step (W12)
        run: |
          case "$MODE" in
            dry-run)      node scripts/push/announce.mjs 2>&1 | node scripts/ops/log-guard.mjs ;;
            frequency)    node scripts/push/announce.mjs --frequency 2>&1 | node scripts/ops/log-guard.mjs ;;
            seed-dry-run) node scripts/push/announce.mjs --seed 2>&1 | node scripts/ops/log-guard.mjs ;;
            seed)         node scripts/push/announce.mjs --seed --apply 2>&1 | node scripts/ops/log-guard.mjs ;;
            apply)        node scripts/push/announce.mjs --apply 2>&1 | node scripts/ops/log-guard.mjs ;;
            *) echo "::error::unknown mode $MODE"; exit 1 ;;
          esac

      - name: Remove the service account
        if: always()
        run: rm -f "${RUNNER_TEMP}/serviceAccountKey.json"
