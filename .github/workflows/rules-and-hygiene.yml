# R9.0 PL-9 — THE JOB THAT WOULD HAVE CAUGHT THE NINE.
#
# The R9.0 audit found nine launch-blocking holes in database.rules.json and
# storage.rules. Nothing in CI looked at either file: reader-tests.yml was the
# only workflow in the repo, and neither rules file was in its trigger paths.
#
# WHY `rules:check` IS NOT THE HEADLINE HERE, despite being the obvious answer.
# rules:check proves repo === live. It was GREEN throughout the audit and caught
# none of the nine, because the holes were in the repo AND in production, in
# perfect parity. Drift detection and permissiveness detection are different
# jobs. So this workflow runs both, and the hermetic one runs first and always:
#
#   rules (no secrets)   — asserts what the rules ALLOW and DENY, against the
#                          emulator. This is the ratchet. Runs on every push.
#   drift (needs secret) — asserts repo === live. Runs only when a rules file
#                          changed, and is skipped on forks, which cannot hold
#                          the secret.
#
# The two are separate JOBS on purpose: a missing or rotated secret must never be
# able to take the assertion suite down with it.

name: rules and hygiene

on:
  push:
    paths: &watched
      - 'database.rules.json'
      - 'storage.rules'
      - 'firebase.json'
      - 'tests/rules/**'
      # R12.4 — the Series admin browser suite runs in the same job as the rules assertions.
      # Without this line, editing the spec alone would not start the job that runs it.
      - 'tests/series/**'
      - 'tests/newsletter/**'
      - 'tests/bookstore/**'
      - 'tests/ci/**'
      # R33.2 — the Square's horizon: its decision logic and the script that runs it.
      - 'tests/square/**'
      - 'scripts/square/**'
      # PL-12 — the build's liveness suite, and R9.1's launch-date guard. Editing either must
      # be able to start the job.
      - 'tests/build/**'
      # ⭑ R9.1 — THE FOUR SUITES CI HAD NEVER RUN, now that it runs them. Adding the step
      # without adding the path is only half a wiring: `app/**` and `functions/**` catch most
      # real changes, but an edit to a SUITE ALONE would still start no job — which is precisely
      # how R43's stale Open Pages assertion sat red on main with nothing to say so, and how a
      # future edit to tests/membership/on-sale.test.mjs could quietly defang the launch
      # interlock. A step whose own test file cannot trigger it is a step that trusts the
      # neighbours.
      - 'tests/membership/**'
      - 'tests/openpages/**'
      - 'tests/leaderboard/**'
      - 'tests/voices/**'
      - 'app/**'
      - 'functions/**'
      - 'scripts/**'
      - 'public/sw.js'
      # R11.18 — THE FOLIATE PIN. The vendored engine and the lock that pins it must BOTH be
      # able to start this job: a vendor edit with no lock update is the drift being caught,
      # and a lock edit with no vendor change is someone re-blessing a number by hand. A path
      # list naming only one of them would let exactly one of those two through.
      - 'public/vendor/**'
      - 'FOLIATE.lock'
      # The carried list the app repo diffs against. --check verifies it BYTE-for-byte, so a
      # hand-edit or an editor's "add final newline" has to be able to start this job too.
      - 'docs/foliate-web-list.txt'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/lint-baseline.json'
      # R9.2 (c): the whole directory, not just this file. test:ci below asserts over EVERY
      # workflow, so an edit to reader-tests.yml has to be able to make this job run.
      - '.github/workflows/**'
  pull_request:
    paths: *watched
  workflow_dispatch:

concurrency:
  group: rules-and-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. THE RULES ASSERTION SUITE. Hermetic: emulator + a `demo-` project id,
  #    which needs no credentials. No secret, so it runs on forks and on every
  #    push, which is the whole point of it being the primary gate.
  # ───────────────────────────────────────────────────────────────────────────
  rules:
    name: rules assertions (emulator)
    runs-on: ubuntu-latest
    # Raised from 10 in R12.4: this job now also installs Chromium and boots `next dev` for
    # the Series admin suite. The rules half alone still finishes in about two minutes.
    timeout-minutes: 25
    steps:
      # R9.2 (c) — action majors pinned off the deprecated node20 runtime. The bump is
      # per-action, not uniform: see the note in reader-tests.yml for which version of which
      # action actually moves to node24, and why upload-artifact needs @v6 where the others
      # need @v5.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # The RTDB and Storage emulators are JVM processes. ubuntu-latest ships a
      # JDK, but pinning one means an image change cannot silently break this.
      # setup-java@v5 deprecates the legacy `adopt` distributions; temurin below is
      # unaffected.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Rules assertions — database.rules.json + storage.rules
        run: npm run test:rules

      # R33.2 — the horizon's decision, asserted without a database. Hermetic and
      # fast, and it sits beside the rules suite because both answer the same
      # question: does the Square do what it was ruled to do?
      - name: The Square's horizon
        run: npm run test:square

      # R12.4 — THE SERIES ADMIN, DRIVEN IN A BROWSER AGAINST THE SAME EMULATORS.
      #
      # It rides this job rather than reader-tests.yml because of which expensive input it
      # needs. reader-tests has Chromium; this job has the JVM, the emulators and the rule
      # files already loaded, and Chromium is one `playwright install` away. The reverse —
      # standing the emulators up inside the reader job — would mean a second JDK and a
      # second emulator boot on every push for one suite.
      #
      # It exists because a control can be correctly wired, correctly keyed and correctly
      # validated and still be DEAD on every record in the database. That is what shipped in
      # R12.4 and no unit test on this platform could have seen it.
      - name: Chromium for the Series admin and Square room suites
        run: npx playwright install --with-deps chromium

      # R43.1 — THE SQUARE ACTUALLY LOADS. The step that would have caught the hang.
      #
      # R33.2 shipped an effect calling onChildAdded/onChildChanged/onChildRemoved/get
      # out of a lazy import that destructured only { ref, onValue }. It threw on every
      # load and the room never left its spinner — in production, signed in and signed
      # out. 78 green tests and a green build saw nothing, because nothing in the repo
      # EXECUTED app/square/page.js: tests/square/postbody.test.mjs renders the eight
      # surfaces through react-dom/server and reads the page only as a string, and
      # `next build` compiles an effect without ever running one.
      #
      # So this step pays for a real build and a real browser, which is the only thing
      # that closes that gap. It drives the static export against LIVE Firebase —
      # square_posts is `.read: true`, so the signed-out case is the whole case, and
      # the failing effect has [] deps and no auth branch anyway.
      #
      # It runs BEFORE test:sponsor deliberately: sponsor wraps itself in
      # `firebase emulators:exec`, and this suite must reach production.
      - name: The Square loads, in a browser, reaching a drawn post
        run: npm run test:square:room
      - name: Series admin — the sponsor logo upload, end to end
        run: npm run test:sponsor

  # ───────────────────────────────────────────────────────────────────────────
  # 2. DRIFT. Proves the console has not been edited behind the repo (RULES.md).
  #    Needs the service account, so it is skipped where the secret is absent
  #    rather than failing — a fork PR must not go red for lacking a credential
  #    it is not allowed to have.
  # ───────────────────────────────────────────────────────────────────────────
  drift:
    name: rules drift (repo === live)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # fetch-depth: 0 because the change-detection below diffs against the push
      # base. The default shallow clone does not contain that commit, so
      # `git cat-file -e` fails and every run falls through to "assume changed" —
      # observed on run 30861696385, where a commit touching no rules file still
      # entered the check.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Did a rules file change?
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BASE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          fi
          if ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "yes=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" "${{ github.sha }}" \
               | grep -qE '^(database\.rules\.json|storage\.rules)$'; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialise the service account
        if: steps.changed.outputs.yes == 'true' && env.KEY != ''
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$KEY" > serviceAccountKey.json

      - name: rules:check — repo must match what Firebase is serving
        if: steps.changed.outputs.yes == 'true' && env.KEY != ''
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm run rules:check

      - name: Note when the check was skipped
        if: steps.changed.outputs.yes != 'true' || env.KEY == ''
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ "${{ steps.changed.outputs.yes }}" != "true" ]; then
            echo "No rules file changed in this push — drift check not needed."
          else
            echo "::warning::FIREBASE_SERVICE_ACCOUNT is not set, so repo-vs-live drift was NOT verified."
          fi

      - name: Remove the key
        if: always()
        run: rm -f serviceAccountKey.json

  # ───────────────────────────────────────────────────────────────────────────
  # 3. HYGIENE. The suites that already existed and never ran, plus two gates.
  # ───────────────────────────────────────────────────────────────────────────
  hygiene:
    name: newsletter · lint ratchet · audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Five suites have existed under tests/newsletter/ and CI has never run one.
      - name: Newsletter suites
        run: npm run test:newsletter

      # R11.22 — tests/bookstore/*.test.mjs was in exactly the same position: sixteen node-only
      # suites, no secrets, no browser, ~3s, and no workflow ran a single one. It is added here
      # rather than left for later because THE PIN LANDED IN IT. A cross-surface contract whose
      # test never runs is not a contract — and the failure it guards is a reader resuming in
      # confident, wrong prose, which nothing else in this repo would notice.
      - name: Bookstore suites (purchases, streaming, the position pin)
        run: npm run test:purchases

      # ⭑⭑ R9.1 — THE MEMBERSHIP SUITES, AND WHY THIS ONE IS THE LAUNCH BLOCKER OF THE THREE.
      #
      # 233 node-only assertions covering both subscription rails, the founding lock, the
      # billing facts /settings reads, and the pass catalogue. NO WORKFLOW HAS EVER RUN THEM.
      #
      # It matters more than the count, because R9.1 put THE ON-SALE INTERLOCK in this suite —
      # tests/membership/on-sale.test.mjs, which fails if MEMBERSHIPS_ON_SALE and the live price
      # books disagree in either direction. That interlock exists because
      # app/lib/membershipPrices.js claimed for four rounds that it was enforced by a file that
      # did not exist. Building the test and leaving it out of CI would have reproduced exactly
      # the failure it was written to end: a safety net nobody runs, described as if it ran.
      #
      # Offline, no secrets, no browser, ~1.3s.
      - name: Membership suites — both rails, and the on-sale interlock
        run: npm run test:membership

      # R9.1 — OPEN PAGES. 162 node-only assertions, in no workflow until now, and it had ALREADY
      # COST SOMETHING: R43 moved the Square announcement's URL out of the post body (a post
      # carries no links) and shipped its own suite for the new behaviour without updating
      # tests/openpages/distribution.test.mjs, which still asserted the URL. main was red for a
      # day and nothing said so. Both assertions are corrected in this round.
      - name: Open Pages suites — moderation, drafts, distribution
        run: npm run test:openpages

      # R9.1 — THE SEASONAL PROGRAM (20) and READER VOICES (32). Same position as the two above:
      # node-only, fast, offline, unwatched. Added together because a job that runs three of the
      # five unwired node suites is a job somebody has to audit again.
      - name: Seasonal program and reader voices
        run: npm run test:program && npm run test:voices

      # R9.2 (c). The workflows check themselves: action majors held above the node24 floor,
      # nothing pinned to a floating tag, and no new action slipping in unrecorded.
      - name: Workflow hygiene (action runtimes)
        run: npm run test:ci

      # ⛔ PL-12 — THE BUILD'S LIVENESS. The launch-blocking one.
      #
      # `output:'export'` means the shop, the library, the voices and the series exist or do not
      # exist according to what a network read returns on a build machine. Measured on 27 Aug
      # 2026: firebase/database's get() NEVER SETTLES against an unreachable database, so every
      # try/catch guarding a build-time read was dead code, and a full build hung 420s with an
      # empty out/. Worse, a build in which only bookstore_titles failed exited 0 and shipped a
      # nineteen-title shelf with one detail page — a shop whose books do not open.
      #
      # This suite injects those faults and asserts what the build actually does. It costs about
      # four and a half minutes, two of which are real `next build` runs and ninety seconds of
      # which is the shipped 20s deadline proving itself end to end. That is the correct price
      # for the only known item that can break the launch deploy.
      - name: Build liveness — timeout, 5xx, empty, malformed, and the half-built shop
        run: npm run test:build

      # R24 — _redirects SILENTLY LOST ITS TAIL, AND HAD FOR MONTHS. Measured against the live
      # site on 27 Aug 2026: 335 rules in the file, 108 served, 227 dropped, 114 legacy story
      # URLs 404'ing with live targets behind them. The cause was one dynamic rule sitting
      # ninth — Cloudflare latches every rule below the first dynamic one into the 100-rule
      # dynamic bucket and then abandons the file. Nothing in CI could see it, because a
      # redirect map is not a page and no suite had ever read one.
      #
      # This runs next to the liveness suite for the same reason that one exists: a rule file
      # that quietly loses its tail is the same class of defect as a catalogue that quietly
      # loses its stories. It needs no build and no browser — about a second, most of it the
      # four generator runs that prove the gate stops a build rather than merely reporting.
      - name: Redirect limits — every rule in _redirects is actually served
        run: npm run test:redirects

      # R9.1 — THE LAUNCH DATE IS WRITTEN IN ONE FILE. R34 inventoried nine launch-date sites by
      # searching for "September" and missed the two that fed a countdown the reader can see,
      # because `{ y: 2026, m: 9, d: 30 }` contains no month name. This scans every shipped form
      # — prose, object literal, ISO, Date.UTC — outside app/lib/launch.js. Under a second.
      - name: The launch date is written in one file
        run: npm run test:launch

      # R24.1 — THE /u PRERENDER MUST STAY GONE. app/u/[handle] emitted 98 pages that Cloudflare
      # had never served once, because a _redirects rule is applied whether or not an asset
      # matches. Only the SOURCE half runs here — the route file reappearing is how this
      # regresses, and this is the workflow whose filter watches app/**. The half that proves
      # the check can fail needs two real builds and rides reader-tests.yml, which already
      # budgets for a build; it is started by tests/**, so editing the suite still runs it.
      - name: The /u prerender stays removed (source half — the build half is in reader-tests)
        run: npm run test:no-u-source

      # R11.18 — THE FOLIATE PIN. "Both surfaces run the same engine" was a convention held by
      # nobody: the app repo enforced it in its own test and this repo enforced nothing, so the
      # two could drift apart in silence. It runs here rather than in reader-tests.yml because
      # it needs neither Chromium nor a build — it is 231 file hashes, well under a second —
      # and because reader-tests.yml does not watch public/vendor/** at all, so a vendor-only
      # change would have started no job whatsoever.
      #
      # Failure names the FILES that moved, not just the number. A pin that can only say "the
      # hash changed" tells you nothing you can act on.
      - name: Foliate engine pin
        run: npm run foliate:check

      # Gates on the DIRECTION, not on zero: 146 errors + 110 warnings stand
      # today and a zero gate would mean a permanently red pipeline. The count
      # may fall and may never rise. See scripts/lint-ratchet.mjs.
      - name: Lint ratchet
        run: npm run lint:ratchet

      # BLOCKING at `critical`, and deliberately not at `high`. Every remaining
      # high in the production tree is next/postcss/sharp, each fixable only by
      # next@16.3.0, and each one a Middleware / Server Component / Server Action
      # / Image Optimization issue — none of which exists in what we deploy,
      # because next.config.mjs sets output:'export'. Gating on `high` would mean
      # a permanently red gate for advisories that cannot affect this site, and a
      # gate nobody can turn green is a gate everybody learns to ignore.
      - name: Audit — production dependencies, blocking on critical
        run: npm audit --omit=dev --audit-level=critical

      # The full picture, including dev, reported but never blocking.
      - name: Audit — full report (advisory)
        if: always()
        run: npm audit || true
