# R7.3 §G — THE READER HARNESS, ON PERMANENT DUTY.
#
# The reader is a geometry surface. Its defects are not type errors or bad props — they are
# a tab that fails to light on a short chapter-end page, a spinner that never stops, a page
# count that drifts by one. None of that is visible in a diff, and all of it is cheap to
# reintroduce. So the harness that proved the mechanics runs on every push that touches the
# reader, rather than on whoever remembers.
#
# TWO SUITES, and they are not the same test twice:
#
#   HOST  tests/reader/playwright.config.mjs — reading-room.html driven directly through
#         tests/reader/harness.html, no React, no Firebase, no network. Geometry, gestures,
#         the load fence, the ribbon rule. Fast and hermetic.
#
#   APP   tests/reader/playwright.app.config.mjs — the real /reader/{slug} route out of
#         out/, so ReadingRoom.js, the gate and the postMessage bridge are production ones.
#         Its subject is RESOLVED from the live catalogue at suite start, not written down —
#         tier 1 a published readerMode cms_story, tier 2 a published bookstore title's
#         sample — and the tier that fired is printed in the run output. That live read is the
#         one external dependency in this workflow, and a deliberate one, because a gate that
#         cannot resolve a slug is exactly the failure worth hearing about. It replaces a
#         hardcoded `beta-princess`, which the Series migration retired in R12 and which then
#         failed every run for eleven rounds. See tests/reader/fixture-story.mjs.
#
# RETRIES ARE 0 HERE, and 1 locally. That asymmetry is the whole point of moving off the
# codespace: `retries: 1` exists in the local config to absorb "Target crashed", which is a
# CONTAINER fact — ~130 MB free with the editor server holding 3 GB, and a 64 MB /dev/shm
# that Chromium exhausts rendering one iframe per EPUB section. A GitHub runner has 16 GB
# and a normal /dev/shm, so the cause is absent and the retry would only serve to hide a
# genuine flake. Green here means green, not green on the second try.
name: reader tests

on:
  push:
    paths: &reader_paths
      - 'public/reading-room.html'
      - 'app/reader/**'
      - 'app/lib/ribbonGeometry.js'
      - 'app/lib/readerCollection.js'
      # R9.3 — the drop-cap tagger and the stylesheet it hooks. Both are shared by the
      # story page AND the offline shelf reader, so a change to either is a reader change.
      - 'app/lib/dropcap.js'
      - 'app/lib/proseCSS.js'
      # R9.5 — the verification resend and the auth-mail client it posts through. Not reader
      # code; this workflow is simply where the browser suites live, because it is the one
      # that installs Chromium. The alternative was a second workflow that installs the same
      # browser to run four seconds of tests.
      - 'app/lib/verifyEmail.js'
      - 'app/lib/authMail.js'
      # R8.1 — the pre-launch gate. It rides this workflow rather than getting its own because
      # it needs the same one expensive input: a built out/. A second workflow would mean a
      # second `npx next build` on every push for the sake of one 19-second suite.
      - 'app/bookstore/**'
      # R9.0 PL-9: was the single file app/lib/bookstore/gate.js, which meant editing
      # the checkout or stream CLIENT — the two modules that carry a purchase — ran
      # nothing at all. The whole directory is in scope now.
      - 'app/lib/bookstore/**'
      # R11.17 — MEMBERSHIP AND /links. Three suites existed under tests/membership/ and CI ran
      # none of them: nothing under .github/workflows/ mentioned membership at all, so the deck
      # parity check and both browser suites only ran when somebody remembered. They ride this
      # workflow for the reason the gate suite already does — they need the same two expensive
      # inputs, a Chromium install and a built out/, and a second workflow would mean a second
      # `npx next build` on every push.
      #
      # THE DECK IS A TRIGGER PATH, not just an input. R11.16's parity check fails when the deck
      # and the page disagree, which means an edit to the deck ALONE has to be able to start this
      # job — that is the half of the guarantee a page-only path list would silently drop.
      - 'app/membership/**'
      - 'app/links/**'
      - 'audit/membership-copy-deck.md'
      # The modules the membership page renders from. A price table, a pass table or a shelf cap
      # changing is a change to what the copy suites assert, even though no copy moved.
      - 'app/lib/membership.js'
      - 'app/lib/membershipPrices.js'
      - 'app/lib/membershipPasses.js'
      - 'app/lib/currency.js'
      - 'app/lib/shelf.js'
      # R8.2 — the payment rails. tests/bookstore/paystack.test.mjs imports these modules
      # directly, so a change to either endpoint must re-run the suite that specifies them.
      - 'functions/api/bookstore/**'
      # R9.0 PL-9: the service worker gates every returning reader's shell, and its own
      # header calls it "the riskiest thing in the repo" (public/sw.js:5). The app suite
      # drives the real out/, so a broken worker surfaces here.
      - 'public/sw.js'
      - 'tests/**'
      # R8.0 — the sample splitter, which tests/reader/sample-epub.spec.mjs imports directly.
      - 'scripts/make-sample-epub.mjs'
      - '.github/workflows/reader-tests.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths: *reader_paths
  # So a green run can be demanded on a branch that touched none of the above.
  workflow_dispatch:

# A second push supersedes the first: the reader suite takes minutes and the older answer
# is worthless the moment it is stale.
concurrency:
  group: reader-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      # R9.2 (c) — ACTION MAJORS, PINNED OFF THE NODE 20 RUNTIME.
      #
      # Every action here was on @v4, which GitHub runs on `node20` and has deprecated. The
      # bump is per-action rather than uniform, because the version that clears node20 is not
      # the same number for all of them — the runtime is what matters, not the tag:
      #
      #   actions/checkout@v5         runs: node24  ✓
      #   actions/setup-node@v5       runs: node24  ✓
      #   actions/setup-java@v5       runs: node24  ✓  (rules-and-hygiene.yml)
      #   actions/upload-artifact@v5  runs: node20  ✗  — v5 shipped "preliminary" node24
      #                                                  support but still DEFAULTS to node20.
      #                                                  v6 is the one that actually moves.
      #
      # So upload-artifact is on @v6 and everything else on @v5, and that asymmetry is
      # deliberate. Check `runs.using` in each action's action.yml before changing any of them;
      # the release notes are not a reliable proxy for it.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium only. The reader is one engine's geometry problem and the other two
      # browsers would triple the minutes to answer a question nobody asked.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Both suites regenerate these anyway (the npm scripts call make-epub first); doing it
      # once up front means a malformed fixture fails HERE, with its own name on it, rather
      # than as a mysterious timeout inside a spec.
      - name: Build fixture EPUBs
        run: node tests/fixtures/make-epub.mjs

      # R8.2 — the payment-rail specs. Offline, no browser, ~100 ms, so they run FIRST: if the
      # naira signature scheme or the idempotency guard is wrong, that answer should not cost
      # a Chromium install and two builds to hear.
      - name: Payment rail specs (Stripe + Paystack)
        run: npm run test:purchases

      # ── R19.6 — EVERY SUITE REPORTS ITS OWN RESULT ────────────────────────────────────────
      #
      # THE FAILURE THIS CLOSES. Steps in a job are sequential AND conditional by default: the
      # first non-zero exit skips every step after it. So when the app harness began failing on
      # a retired fixture slug in R12, the run did not report "the app suite is broken" — it
      # reported nothing at all about the gate, currency, territory, deck-parity, membership-copy
      # or /links suites, because none of them ran. Six suites went dark behind one, for eleven
      # rounds, and the summary looked identical to a run in which they had all passed and one
      # had not. That is worse than a red suite: it is a red suite wearing five silences.
      #
      # `if: always()` on every suite from here down means each one runs and reports whatever it
      # finds, whatever the step before it did. The job still goes red on any failure — nothing
      # is being tolerated, only made visible.
      #
      # ⚠ `!cancelled()`, NOT `always()` — R19.7. R19.6 shipped `always()`, which also runs the
      # remaining steps when the workflow is CANCELLED. This workflow sets cancel-in-progress
      # (see the concurrency block above) precisely so a superseded run stops costing minutes,
      # and `always()` quietly defeated it: a push that superseded another left the older run
      # grinding through twelve more suites nobody would read. `!cancelled()` keeps every suite
      # reporting independently on a real run and lets a cancellation actually cancel.
      #
      # SETUP STEPS ARE DELIBERATELY NOT GUARDED. npm ci, the Chromium install and the fixture
      # build are inputs, not answers: if one of them fails there is nothing to report, only
      # eleven identical infrastructure errors to read.
      # R9.3 — the drop-cap tagger. Needs no server and no EPUB (every case is a string of
      # prose HTML in page.setContent), so it costs seconds and runs before the geometry
      # suites: "which paragraph gets the cap" should not wait on a build to be answered.
      - name: Drop-cap targeting
        run: npx playwright test -c tests/dropcap/playwright.config.mjs
        if: ${{ !cancelled() }}

      # R9.5 — the verification resend goes to the branded sender. Same shape as above: no
      # server, no build, the endpoint is intercepted. It asserts the REQUEST (URL, bearer
      # token, body) because the regression it guards is silent — restore the firebase/auth
      # call and mail quietly reverts to an untraceable firebaseapp.com template with nothing
      # failing.
      - name: Verification resend
        run: npx playwright test -c tests/verify-email/playwright.config.mjs
        if: ${{ !cancelled() }}

      - name: Host harness (reading-room.html)
        run: npx playwright test -c tests/reader/playwright.config.mjs
        if: ${{ !cancelled() }}

      # §H's build gate, and the app suite's input in one step: out/ IS the artifact
      # Cloudflare Pages serves, and it is what the app config drives.
      - name: Build the static export
        run: npx next build
        if: ${{ !cancelled() }}

      - name: App harness (the React boundary)
        run: npx playwright test -c tests/reader/playwright.app.config.mjs
        if: ${{ !cancelled() }}

      # R8.1 — the pre-launch gate, against the same out/ the step above built. Its own port
      # (4323), so it neither waits for nor collides with the reader suite's server.
      - name: Gate harness (the pre-launch curtain)
        run: npx playwright test -c tests/bookstore/playwright.gate.config.mjs
        if: ${{ !cancelled() }}

      # R8.3. Separate step rather than folded into the gate config: the two suites drive
      # different surfaces on different ports, and a currency failure should not read as a
      # gate failure in the run summary.
      - name: Currency harness (selection, marks and rails)
        run: npx playwright test -c tests/bookstore/playwright.currency.config.mjs
        if: ${{ !cancelled() }}

      # R8.4. Its own port (4325) and its own step, for the same reason as the currency suite:
      # a territory failure should read as a territory failure in the run summary, not as a
      # currency one. The two share a store and a region call, so a regression in either can
      # surface in the other — which is exactly why both names need to be visible.
      - name: Territory harness (rights, marks and the disabled button)
        run: npx playwright test -c tests/bookstore/playwright.territory.config.mjs
        if: ${{ !cancelled() }}

      # ── R19.7 — THE FOUR SUITES THAT RAN NOWHERE ──────────────────────────────────────────
      #
      # placement, boundbook, masthead and flip existed for rounds — R15 through R17.4 — and NO
      # workflow ran a single one of them. They were written to pin house-design decisions that
      # a diff cannot show: where a curated table sits between the shelf rows, that the book has
      # no feet and its contact pool is at the derived depth, that the masthead's air is
      # transferred rather than added, and that every book on the shop turns over with an
      # identical affordance set. All four are exactly the kind of assertion that only ever runs
      # when somebody remembers — which, measured, was never.
      #
      # ⚠ AND ONE OF THEM WAS RED THE WHOLE TIME. boundbook's contact-pool assertion had been
      # failing since R17.4 against a stale baseline, unseen because nothing ran it. R19.7
      # re-derived it (see CONTACT_SHADOW_REBASE in app/bookstore/components/BoundBook.js) and
      # added a geometry test that pins the ruling by exact numbers rather than by the tail of a
      # blur. A suite in no workflow is not a suite; it is a file that used to be one.
      #
      # THE PATHS ALREADY COVER THEM, and that is checked rather than assumed: all four read
      # only from app/bookstore/** and app/lib/bookstore/**, both already in reader_paths above,
      # and all four drive /bookstore out of the same out/ this job already builds. No new
      # trigger path is added because none is needed — adding redundant ones would suggest a
      # coverage that the existing two lines already give.
      #
      # COST, measured locally on the built export: placement 14.8s, boundbook 25.5s, masthead
      # 4.4s, flip 26.8s — about 72 seconds of suite time, or a minute and a half of job time
      # once each step's own startup is counted. Against a job that already runs thirteen
      # minutes, for four suites that pin rulings nobody can re-derive from a screenshot.
      #
      # Own ports (4326-4329, see each config), own steps: a masthead failure must read as a
      # masthead failure in the run summary, not as somebody else's.
      - name: Placement harness (curated tables between the shelf rows)
        run: npx playwright test -c tests/bookstore/playwright.placement.config.mjs
        if: ${{ !cancelled() }}

      - name: Bound-book harness (no feet, the contact pool, three across)
        run: npx playwright test -c tests/bookstore/playwright.boundbook.config.mjs
        if: ${{ !cancelled() }}

      - name: Masthead harness (the air is transferred, not added)
        run: npx playwright test -c tests/bookstore/playwright.masthead.config.mjs
        if: ${{ !cancelled() }}

      - name: Flip harness (every book on the shop turns over)
        run: npx playwright test -c tests/bookstore/playwright.flip.config.mjs
        if: ${{ !cancelled() }}

      # R23 — THE ARRIVAL. Ikenna cut the detail page's entrance reveal on 27 Aug: a 600ms
      # fadeUp on the wrapper around all the ready content, which was re-drawing the R22C seed
      # board from transparent (measured effective opacity 1 -> 0 -> 1) and making the page
      # look assembled rather than arrived. This suite reads computed style at the FIRST FRAME
      # the content exists — the frame that used to read opacity 0 — and its last case puts the
      # animation back and requires the other four to go red.
      - name: Arrival harness (the detail page renders finished, nothing settles)
        run: npx playwright test -c tests/bookstore/playwright.reveal.config.mjs
        if: ${{ !cancelled() }}

      # R26 — THE COVER'S OWN ARRIVAL. Ikenna, 27 Aug, after R23: "the cover assembles in two
      # beats when the detail page is opened." Measured, the two beats were an EMPTY board —
      # the <img> is in no served detail page, so the request could not start until React had
      # hydrated behind the R9 gate — and then a SECOND board, because the loading and ready
      # states were two JSX branches each rendering their own <BoundBook>. The drawn board
      # moved 53.42px on a laptop and 33px across plus 53.42px down on a handset.
      #
      # It runs BOTH viewports, and that is the point of a separate step: the handset carried a
      # horizontal displacement the laptop did not, from a media query that could not reach the
      # loading branch because that branch had no `.bd-header` class. A suite pinned to 1280
      # would have been green through the whole defect.
      #
      # Ten cases at each of two viewports, five of them mutation twins that inject the
      # measured pre-R26 defect and require their assertion to invert. ~66s, on the out/ built
      # above. Own port (4333).
      - name: Cover arrival harness (one box, one <img>, one file, asked for at navigation)
        run: npx playwright test -c tests/bookstore/playwright.cover-arrival.config.mjs
        if: ${{ !cancelled() }}

      # R25 — THE STOREFRONT'S VERTICAL RHYTHM. Ikenna, 27 Aug: the web shop has black voids
      # between its elements, bring it to the app's sizing. The paddings all dated from 14 Jul,
      # when the shop stood on a violet gradient and later a grain; R22.1 made the ground flat
      # black on the morning of the 27th and nothing was retuned for it. The masthead's
      # min-height:88vh with align-items:center was putting HALF A LEFTOVER VIEWPORT under the
      # currency line — 219px on a 402x874 phone, 209 on a 1440x900 laptop, a void whose size
      # was a function of the device.
      #
      # It runs at 402 and 1280 because the catalogue's vertical padding used to BE a
      # breakpoint (48 handset / 64 laptop) — two rhythms, neither written down — and a suite
      # pinned to one width would have been green through half of it.
      #
      # ⭑ AND IT IS THE ONE THING THAT CAN CATCH A CONSTANT BEING RETYPED. The ruled figures
      # are literals in the spec, asserted BOTH against SHOP_RHYTHM and against the built
      # page, so editing a constant and nothing else goes red — demonstrated, not assumed.
      # Own port (4334).
      - name: Rhythm harness (the shop's section intervals, both breakpoints)
        run: npx playwright test -c tests/bookstore/playwright.rhythm.config.mjs
        if: ${{ !cancelled() }}

      # R19.8 — THE BUY/SAMPLE PAIR, MEASURED AT THREE VIEWPORTS.
      #
      # It rides here rather than in territory.spec.mjs or currency.spec.mjs — the two nearest
      # suites that already open /bookstore/[slug] — for two reasons set out at length in
      # tests/bookstore/playwright.pair.config.mjs: those are pinned to ONE viewport, and the
      # mismatch this guards was 11.83px at 820 and 1280 but 87.34px at 390, where the row
      # wrapped entirely; and they are observing suites over a live catalogue, while this one
      # deletes the availability note and forces the unavailable state on in order to measure
      # them.
      #
      # Cheap: fifteen cases, no build of its own (it uses the out/ built above), ~14s.
      - name: Pair harness (buy and sample share one height and one centre)
        run: npx playwright test -c tests/bookstore/playwright.pair.config.mjs
        if: ${{ !cancelled() }}

      # R20 — THE SHELF'S WEIGHT. A budget on what a cover may weigh, on how much larger than
      # its board it may be served, and a ratchet on how many layers a full shelf composites —
      # plus the grain's attachment, which is Ikenna's ruling of 26 Aug 2026 and is one word in
      # a stylesheet away from being reversed.
      #
      # THIS IS THE ONLY THING IN CI THAT CAN SEE A WEIGHT REGRESSION. Nothing else goes red
      # when a curator uploads a 4 MB cover through a browser that could not encode WebP: the
      # page still renders, the build still passes, and the shop is simply slower forever. The
      # budgets fail on pre-R20 HEAD — 14.5 MiB against a 2 MiB ceiling — which was checked
      # rather than assumed.
      #
      # It runs last of the bookstore suites because it is the slowest: every case loads the
      # whole shop and two of them scroll it to the foot so the lazy covers are really asked for.
      - name: Payload harness (cover budgets, layer ratchet, the grain's attachment)
        run: npx playwright test -c tests/bookstore/playwright.payload.config.mjs
        if: ${{ !cancelled() }}

      # ── R11.17 — MEMBERSHIP AND /links ────────────────────────────────────────────────────
      #
      # All three run against the out/ built above. Ordered cheapest first: the deck check is
      # node-only and finishes in ~100 ms, so "the deck and the page disagree" should not cost
      # two browser suites to hear. It is the same order as the test:membership-copy script,
      # which is deliberate — one chain, two places to run it, no divergence in what runs first.
      - name: Deck parity (the copy deck vs the shipped page)
        run: node --test tests/membership/deck-parity.test.mjs

      # R24.1 — the falsifiable half of the /u check. It runs TWO real `next build`s of its
      # own: one clean, asserting out/u is empty and the sitemap names no /u URL, and one with
      # a canary route restored, requiring the pages to come back. Without the second, "out/u
      # is empty" would also pass against a typo in the path or a build that emitted nothing.
      # It rides this workflow because it is the one that budgets for builds; the cheap source
      # half runs in rules-and-hygiene, whose filter watches app/**.
      - name: The /u prerender stays removed — and the check is proved able to see it
        run: npm run test:no-u-prerender
        if: ${{ !cancelled() }}

      # Its own port (4327). It claimed 4325 until R11.17 and the territory suite above has held
      # 4325 since R8.4 — a clash that could not bite while these suites never shared a job, and
      # this step is what would have made it bite. See the header of the copy config.
      - name: Membership copy matrix (3 currencies × 2 intervals × 3 cards)
        run: npx playwright test -c tests/membership/playwright.copy.config.mjs
        if: ${{ !cancelled() }}

      # MEMBERSHIP_STATE=pre, matching MEMBERSHIP_LAUNCHED=false in the build above. The flag is
      # a build-time constant, so the post-launch wording cannot be exercised in the same run —
      # on launch day the flag and this line move together, in one change.
      - name: /links harness (membership entry, readers' group)
        run: npx playwright test -c tests/membership/playwright.links.config.mjs
        if: ${{ !cancelled() }}
        env:
          MEMBERSHIP_STATE: pre

      # R19.6 — THE DEPLOY HOOK, PROVEN ABSENT FROM WHAT WE SERVE.
      #
      # It runs HERE, after the build, and not in the hygiene job with the rest of test:ci,
      # because the half of this suite that matters scans out/ — the sources can be perfectly
      # clean and a bundler can still emit the value. Without a built out/ the suite says so
      # loudly and asserts only the source half; this step is what makes it assert both.
      #
      # ⚠ It is currently a RATCHET, not a clean pass: two live deploy-hook URLs were already
      # hardcoded in client components when it was written, and are already in the deployed
      # bundle. Read the header of tests/ci/deploy-hook-secrecy.test.mjs before touching it.
      - name: Deploy hook secrecy (sources + the built export)
        run: node --test tests/ci/deploy-hook-secrecy.test.mjs
        if: ${{ !cancelled() }}

      - name: Upload traces and reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: reader-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
