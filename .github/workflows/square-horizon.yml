# THE SQUARE'S HORIZON — the thing that must actually run.
#
# What it replaces never executed once in 150 days. app/api/square-cleanup was a
# Next.js route handler under app/api/, which `output: 'export'` never builds, so
# the URL 404s — and nothing called it anyway. Two independent fatal faults, and
# neither was visible from the code: the file looked like a working endpoint.
#
# ⚠ HOURLY, NOT AT A FIXED TIME. The bell is 20:00 LONDON. Cron runs on UTC, and
# London is UTC+1 in summer and UTC+0 in winter, so a fixed UTC schedule drifts
# an hour off the bell twice a year and starts sweeping in the middle of a live
# session. The script decides: it no-ops unless the London hour is 20. Twenty-
# three of the twenty-four daily runs do nothing but touch a heartbeat, which
# costs two reads.
#
# ⚠ AND IT SAYS SO WHEN IT STOPS. GitHub disables scheduled workflows on repos
# with no activity for 60 days, and a silent cron is exactly how the last one
# died. Every run writes square_horizon/, and the liveness job below FAILS —
# visibly, in the Actions tab and by email — if the last bell is more than 26
# hours old. A horizon nobody can tell has stopped is not a horizon.

name: square horizon

# ═══════════════════════════════════════════════════════════════════════════
# ⭑ ARMED — 4 SEP 2026, ON IKENNA'S RULING
# ═══════════════════════════════════════════════════════════════════════════
#
# ⚠ THE CRON IS THE SWITCH. The `Sweep` step passes --apply on ANY scheduled run,
# so commenting the schedule out is the only thing that disarms this workflow and
# restoring it is the arming. There is no second switch behind it. If you ever
# need to stop the horizon, comment the two lines below again — do not rely on
# disabling the workflow in the Actions UI, which someone can re-enable without
# reading any of this.
#
# What was verified before arming, in this order:
#   · a dispatch dry run on a real runner: 40s, success, credential resolved for
#     the first time, and its plan matched the local run exactly.
#   · that run printed "at the bell: no (hour 21) — a sweep would no-op", so the
#     London gate is real rather than aspirational.
#   · square_horizon HAS a deployed rule — {".read": true, ".write": false} — and
#     the heartbeat write was proved end to end: the Admin SDK service account
#     writes it (rules do not apply to a service account), an unauthenticated
#     write is refused 401, and an unauthenticated read is allowed so the admin
#     page can see the bell. Without that rule the heartbeat would have failed
#     silently and the liveness check would have been measuring its own absence.
#
# ⚠ THE FIRST REAL BELL IS SATURDAY 5 SEPTEMBER 2026, 20:05 LONDON (19:05 UTC).
# It moves 114 records to square_archive and leaves 4 — the two pinned threads
# and their one reply each. NOT the 113/5 of the dispatch dry run: that was
# measured on the Friday evening, and the one unpinned thread still inside the
# horizon then is ~70 hours old by Saturday's bell and goes with the rest.
#
# NOTHING IS DELETED. Records move to square_archive, which is world-readable and
# reachable at /square/p?id=… Ikenna is accepting that the thirteen
# congratulations on the winners announcement arrived as separate ROOT posts, so
# the pin does not protect them and they go; the announcement itself survives with
# its one reply, because a pin protects the thread and not the subject.

on:
  schedule:
    - cron: '5 * * * *'   # hourly at :05 UTC; the script acts only at London 20:00
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write. Unticked, this only reports what would move.'
        required: false
        type: boolean
        default: false
      force:
        description: 'Sweep even outside the 20:00 bell. For a manual catch-up only.'
        required: false
        type: boolean
        default: false

concurrency:
  group: square-horizon
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      # R9.2 (c) — ACTION MAJORS PINNED OFF THE DEPRECATED node20 RUNTIME, and
      # node 22 to match every other workflow in this repo. This file arrived on
      # @v4/node20 because it was written on a branch cut before that ruling
      # landed, and it was the only workflow here still on them. An untested
      # toolchain is precisely the wrong thing to discover on the run that sweeps
      # the room.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Write the service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not set. The horizon cannot run."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > serviceAccountKey.json

      - name: Sweep
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then
            ARGS="--apply"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          node scripts/square/horizon.mjs $ARGS

      - name: Liveness — fail loudly if the bell has been missed
        if: github.event_name == 'schedule'
        run: node scripts/square/horizon-liveness.mjs

      - name: Shred the credential
        if: always()
        run: rm -f serviceAccountKey.json
