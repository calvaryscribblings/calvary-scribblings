# W12 — ONE-SHOT: delete the logs of the account-scrub runs that printed deleted readers' IDs.
#
# Ikenna's decision (26 Sep 2026). The Codespace's token cannot write to Actions, so this runs with
# the workflow's own token, granted `actions: write` for this job only. It deletes LOGS, not runs:
# each run keeps its record and its pass/fail. It refuses any id that is not an account-scrub run
# created before the fix (4d4ed9b5, 26 Sep 02:29 UTC), then checks every log is gone. Run ids are
# not personal data; the job prints nothing else. Removed from the repo once it has run.
name: w12 purge scrub logs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/w12-purge-logs.yml'

permissions:
  actions: write
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete the logs of the nine runs, then prove they are gone
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUNS: >-
            36087964754 36086661691 36085017336 36084021925 36005556670
            36003638999 35997300138 35928937239 35928001383
        shell: bash
        run: |
          FIX_AT="2026-09-26T02:29:00Z"
          deleted=0
          for id in $RUNS; do
            meta=$(gh api "repos/$REPO/actions/runs/$id" --jq '[.name, .created_at, .conclusion] | @tsv')
            name=$(cut -f1 <<<"$meta"); at=$(cut -f2 <<<"$meta"); result=$(cut -f3 <<<"$meta")
            if [ "$name" != "account scrub" ] || [[ "$at" > "$FIX_AT" ]]; then
              echo "::error::refusing run $id ($name, $at) — not a pre-fix account-scrub run"; exit 1
            fi
            gh api -X DELETE "repos/$REPO/actions/runs/$id/logs" --silent
            deleted=$((deleted+1))
            echo "run $id ($at, $result): logs deleted"
          done
          left=0
          for id in $RUNS; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/runs/$id/logs")
            still=$(gh api "repos/$REPO/actions/runs/$id" --jq '.conclusion')
            echo "run $id: logs HTTP $code; run record kept, conclusion $still"
            if [ "$code" = "200" ]; then left=$((left+1)); fi
          done
          echo "deleted $deleted; logs still present: $left"
          [ "$left" = "0" ]
